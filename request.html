<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a cake · Dream Cake Builder</title>
<meta name="theme-color" content="#c12c7e">
<link rel="icon" href="lilac/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dcb-theme.css">
<style>
.req-wrap{max-width:680px;margin:0 auto;padding:0 16px}
.req-card{padding:18px 20px}
.req-card h1{font-size:clamp(26px,4vw,34px);margin-bottom:4px}
.req-card .lead{color:var(--muted);margin-bottom:12px}
.field{margin:10px 0}
.field>label,.lbl{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.req{color:var(--rose)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:120px;resize:vertical}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:#fffd;cursor:pointer}
.pic.add{display:flex;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;color:var(--rose-ink);font-weight:500;font-size:13px;text-align:center}
.pic.add:hover{background:var(--rose-soft)}
.submit{width:100%;min-height:46px;font-size:16px;margin-top:6px}
.msg{padding:12px 14px;border-radius:10px;background:var(--rose-soft);color:var(--rose-ink);font-weight:500;margin:10px 0}
.msg.ok{background:var(--teal-soft);color:var(--teal)}
.fine{font-size:12px;color:var(--muted);margin-top:8px}
.qyes{display:flex;gap:14px}.qyes label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:15px}
.like{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--rose-soft);margin:6px 0 10px}.like img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:30px 20px}
.done .big{font-family:Fraunces,Georgia,serif;font-size:28px;color:var(--teal);margin-bottom:6px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<header class="site-head">
 <div class="head-in">
  <a class="brand" href="index.html" aria-label="Dream Cake Builder home"><img src="lilac/assets/favicon.svg" alt="" data-fallback width="34" height="34"><span class="bt"><span class="bn">Dream <span>Cake</span> Builder</span><small class="tag">See it before you bake it.</small></span></a>
  <nav class="site-nav" aria-label="Main"><a href="index.html">Home</a><a href="contact.html">Contact</a><a href="account.html" data-acct>Sign in</a></nav>
  <details class="menu"><summary aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></summary><div class="menu-panel"><a href="index.html">Home</a><a href="contact.html">Contact</a></div></details>
 </div>
</header>

<main class="band">
 <div class="req-wrap"><div class="card req-card" id="app"><p class="muted">Loading the order form…</p></div></div>
</main>

<footer class="site-foot"><div class="foot-in"><span>Order requests powered by <a href="index.html">Dream Cake Builder</a>.</span><a href="privacy.html">Privacy</a><span class="end">© <span data-year>2026</span></span></div></footer>

<script src="assets/dcb-site.js" defer></script>
<script>
{
const SUPABASE_URL='https://gcorvodfcxhumesttwvj.supabase.co';
const KEY='sb_publishable_6ruYyVr__8c65Az5WCsiaA_jD9AcOgb';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('app');
// shop link: request.html?shop=your-shop (or #shop=your-shop)
const params=new URLSearchParams(location.search.slice(1)||location.hash.slice(1));
const slug=(params.get('shop')||'').trim().toLowerCase();
const like=(params.get('like')||'').slice(0,80),likeImg=params.get('img')||'';
let info=null,pics=[],busy=false;

const rpc=(fn,body)=>fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(),'image/jpeg',.82)};img.src=r.result};r.readAsDataURL(file)})}

function closed(title,text){app.innerHTML=`<div class="done"><div class="big">${esc(title)}</div><p class="muted">${esc(text)}</p><p class="fine" style="margin-top:14px"><a href="index.html">Go to Dream Cake Builder</a></p></div>`}

function form(){
 const today=new Date().toISOString().slice(0,10);
 app.innerHTML=`<span class="eyebrow">Cake request</span><h1>Order a cake from ${esc(info.business)}</h1>
 <p class="lead">Tell us about your celebration. You'll get a reply with questions or a quote. This isn't a booking until your quote is accepted.</p>
 <form id="rf" novalidate>
  <div class="grid2"><div class="field"><label for="f-name">Your name <span class="req">*</span></label><input type="text" id="f-name" required maxlength="120" autocomplete="name"></div>
  <div class="field"><label for="f-email">Email <span class="req">*</span></label><input type="email" id="f-email" required maxlength="254" autocomplete="email"></div>
  <div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" maxlength="40" autocomplete="tel"></div>
  <div class="field"><label for="f-date">Event date</label><input type="date" id="f-date" min="${today}"><div id="dmsg" class="fine" style="margin-top:4px"></div></div>
  ${info.event_types.length?`<div class="field"><label for="f-event">Occasion</label><select id="f-event"><option value="">Choose…</option>${info.event_types.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div>`:''}
  <div class="field"><label for="f-serv">How many servings?</label><input type="number" id="f-serv" min="0" max="10000" inputmode="numeric"></div></div>
  ${like?`<div class="like">${/^https:\/\/gcorvodfcxhumesttwvj\.supabase\.co\//.test(likeImg)?`<img src="${esc(likeImg)}" alt="">`:''}<div><b>Something like “${esc(like)}”</b><div class="fine" style="margin:0">From the ${esc(info.business)} gallery</div></div></div>`:''}
  <div class="field"><label for="f-details">What would you like? <span class="req">*</span></label><textarea id="f-details" required maxlength="5000" placeholder="Flavors, colors, theme, tiers, any writing on the cake, allergies…">${like?esc(`I'd love something like "${like}" from your gallery.\n\n`):''}</textarea></div>
  ${(info.questions||[]).map((q,i)=>qField(q,i)).join('')}
  <div class="field"><span class="lbl">Inspiration photos (up to 8)</span><div class="pics" id="pics"></div></div>
  <label class="trap" aria-hidden="true">Website<input id="f-web" tabindex="-1" autocomplete="off"></label>
  <div id="rmsg" role="status" aria-live="polite"></div>
  <button class="btn primary submit" type="submit">Send my request</button>
  <p class="fine">Your details go only to ${esc(info.business)} so they can reply about your cake.</p>
 </form>`;
 drawPics();
}
function qField(q,i){const id='q-'+i,lab=`${esc(q.q)}${q.required?' <span class="req">*</span>':''}`;
 if(q.type==='long')return `<div class="field"><label for="${id}">${lab}</label><textarea id="${id}" data-q="${i}" maxlength="1000" style="min-height:80px"></textarea></div>`;
 if(q.type==='choice')return `<div class="field"><label for="${id}">${lab}</label><select id="${id}" data-q="${i}"><option value="">Choose…</option>${(q.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
 if(q.type==='yes')return `<div class="field"><span class="lbl">${lab}</span><div class="qyes"><label><input type="radio" name="${id}" data-q="${i}" value="Yes"> Yes</label><label><input type="radio" name="${id}" data-q="${i}" value="No"> No</label></div></div>`;
 return `<div class="field"><label for="${id}">${lab}</label><input type="text" id="${id}" data-q="${i}" maxlength="1000"></div>`}
function answers(){return (info.questions||[]).map((q,i)=>{let v='';if(q.type==='yes'){const c=document.querySelector(`input[data-q="${i}"]:checked`);v=c?c.value:''}else{const el=document.querySelector(`[data-q="${i}"]`);v=el?el.value.trim():''}return{id:q.id,q:q.q,a:v,required:q.required}})}
const isFull=d=>!!d&&(info.full_dates||[]).includes(d);
function dateNote(){const d=$('f-date')&&$('f-date').value,n=$('dmsg');if(!n)return;n.textContent=isFull(d)?'That date is fully booked. Please pick another date.':'';n.style.color=isFull(d)?'var(--rose-ink)':''}
document.addEventListener('input',e=>{if(e.target.id==='f-date')dateNote()});
function drawPics(){const box=$('pics');if(!box)return;box.innerHTML=pics.map((p,i)=>`<div class="pic"><img src="${p.url}" alt="Inspiration photo ${i+1}"><button type="button" data-del="${i}" aria-label="Remove photo">✕</button></div>`).join('')+(pics.length<8?`<label class="pic add"><input type="file" id="picIn" accept="image/*" multiple hidden>+ Add photos</label>`:'')}

document.addEventListener('change',async e=>{if(e.target.id!=='picIn')return;const files=[...e.target.files].slice(0,8-pics.length);for(const f of files){if(!f.type.startsWith('image/'))continue;try{pics.push(await shrink(f))}catch{}}drawPics()});
document.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){pics.splice(+d.dataset.del,1);drawPics()}});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='rf')return;e.preventDefault();if(busy)return;
 const m=$('rmsg'),btn=e.target.querySelector('button[type=submit]');m.className='';m.textContent='';
 const name=$('f-name').value.trim(),email=$('f-email').value.trim(),details=$('f-details').value.trim();
 if($('f-web').value)return;
 if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!details){m.className='msg';m.textContent='Please add your name, a valid email and what you would like.';return}
 if(isFull($('f-date').value)){m.className='msg';m.textContent='That date is fully booked. Please pick another date.';$('f-date').focus();return}
 const ans=answers(),miss=ans.find(a=>a.required&&!a.a);if(miss){m.className='msg';m.textContent=`Please answer: ${miss.q}`;return}
 busy=true;btn.disabled=true;btn.textContent='Sending…';
 try{
  const paths=[];
  for(const p of pics){const path=`${info.shop_id}/requests/${crypto.randomUUID()}.jpg`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/shop-files/${path}`,{method:'POST',headers:{...H,'Content-Type':'image/jpeg','x-upsert':'false'},body:p.blob,signal:AbortSignal.timeout(30000)});if(r.ok)paths.push(path)}
  const r=await rpc('shop_submit_request',{p_slug:slug,p_name:name,p_email:email,p_phone:$('f-phone').value.trim()||null,p_event_date:$('f-date').value||null,p_event_type_id:($('f-event')&&$('f-event').value)||null,p_servings:$('f-serv').value?+$('f-serv').value:null,p_details:details,p_image_paths:paths,p_answers:ans.filter(a=>a.a).map(a=>({id:a.id,a:a.a}))});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.message||'send failed')}
  try{const rid=await r.clone().json();if(typeof rid==='string')fetch(`${SUPABASE_URL}/functions/v1/shop-notify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'request',id:rid}),keepalive:true}).catch(()=>{})}catch{}
  app.innerHTML=`<div class="done"><div class="big">Request sent!</div><p class="muted">Thank you, ${esc(name.split(' ')[0])}. ${esc(info.business)} will reply to ${esc(email)} soon.</p></div>`;
 }catch(err){m.className='msg';m.textContent=/fully booked/i.test(err.message)?'That date is fully booked. Please pick another date.':/too many/i.test(err.message)?'You have sent a few requests already. Please wait a little and try again.':/not taking/i.test(err.message)?'This shop is not taking requests right now.':'We couldn’t send your request. Please check your connection and try again.';btn.disabled=false;btn.textContent='Send my request'}
 finally{busy=false}
});

(async()=>{
 if(!slug){info={shop_id:'preview',business:'your cake artist',accepting:true,event_types:[{id:'',name:'Birthday'},{id:'',name:'Wedding'}],questions:[{id:'p1',q:'Cake flavor',type:'choice',options:['Vanilla','Chocolate','Not sure yet']},{id:'p2',q:'Pickup or delivery?',type:'choice',options:['Pickup','Delivery'],required:true}],full_dates:[]};form();const n=document.createElement('p');n.className='msg';n.textContent='Preview: add ?shop=your-shop-link to the address to use a real order form.';app.prepend(n);const f=$('rf');f.addEventListener('submit',ev=>{ev.stopImmediatePropagation();ev.preventDefault();$('rmsg').className='msg';$('rmsg').textContent='Preview only. Nothing was sent.'},true);return}
 try{const r=await rpc('shop_form_info',{p_slug:slug});if(!r.ok)throw 0;info=await r.json();
  if(!info)return closed('Order form not found','Check the link you were given, or contact the cake artist directly.');
  if(!info.accepting)return closed(`${info.business} isn't taking requests right now`,'Please check back soon or contact them directly.');
  form();
  if(info.portfolio){const n=document.createElement('p');n.className='fine';n.style.margin='0 0 8px';n.innerHTML=`Looking for ideas? <a href="portfolio.html?shop=${encodeURIComponent(slug)}">See ${esc(info.business)}'s cakes</a>`;app.querySelector('.lead').after(n)}
 }catch{closed('We couldn’t load the order form','Please check your connection and try again.')}
})();
}
</script>
</body>
</html>
