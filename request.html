  ${f.handoff.on&&byId('f_handoff')&&byId('f_ptime')&&c.slots?`<div class="field ptwrap" id="ptWrap" hidden><label for="q-f_ptime">Pickup time</label><select id="q-f_ptime" data-q="f_ptime"><option value="">Choose a time…</option></select><div class="fine" id="ptMsg" style="margin-top:4px"></div></div>`:''}
  ${picks.length?`<h2 class="sh">Add to your order</h2><p class="fine" style="margin:-4px 0 8px">Tap anything you'd like.</p><div class="picks">${picks.map(sec).join('')}</div>`:''}
  ${other.map(sec).join('')}
  ${like?`<div class="like">${/^https:\/\/gcorvodfcxhumesttwvj\.supabase\.co\//.test(likeImg)?`<img src="${esc(likeImg)}" alt="">`:''}<div><b>Something like “${esc(like)}”</b><div class="fine" style="margin:0">From the ${esc(info.business)} gallery</div></div></div>`:''}
  <h2 class="sh">Your cake</h2>
  ${f.theme.on&&byId('f_theme')?qField(byId('f_theme')).replace('maxlength="1000"','maxlength="200" placeholder="Like Lion King, garden party or pink and gold"'):''}
  <div class="field"><label for="f-details">Tell us about your cake${req(f.details.req)}</label><textarea id="f-details" maxlength="5000" placeholder="Flavors, colors, theme, tiers, any writing on the cake, allergies…">${like?esc(`I'd love something like "${like}" from your gallery.\n\n`):''}</textarea></div>
  ${f.photos.on?`<div class="field"><span class="lbl">Inspiration photos (up to 8)${req(f.photos.req)}</span><div class="pics" id="pics"></div></div>`:''}
  <label class="trap" aria-hidden="true">Website<input id="f-web" tabindex="-1" autocomplete="off"></label>
  ${c.note?`<div class="prenote">${esc(c.note)}</div>`:''}
  <div id="rmsg" role="status" aria-live="polite"></div>
  <button class="btn primary submit" type="submit"${PREVIEW?' disabled':''}>${esc(LK.btn||'Send my request')}${PREVIEW?' (preview)':''}</button>
  <p class="fine">Your details go only to ${esc(info.business)} so they can reply about your cake.</p>
 </form>${WEB()&&info.brand!==false?`<p class="brandline"><a href="https://www.dreamcakebuilder.com" target="_blank" rel="noopener">Order form by Dream Cake Builder</a></p>`:''}`;
 drawPics();sizeUp();draftInit();
}
// Keep what the customer typed if they leave and come back (this device only; cleared once sent).
const DKEY=()=>'dcb-req-draft:'+slug;
function draftKey(el){return el.id?'#'+el.id:el.name?'@'+el.name+'='+el.value:''}
function draftSave(){if(PREVIEW)return;const f=$('rf');if(!f)return;const o={};let any=false;
 f.querySelectorAll('input,select,textarea').forEach(el=>{if(el.type==='file'||el.type==='hidden'||el.type==='submit')return;const k=draftKey(el);if(!k)return;
  if(el.type==='checkbox'||el.type==='radio'){if(el.checked){o[k]=1;any=true}}else if(el.value){o[k]=el.value;any=true}});
 try{any?localStorage.setItem(DKEY(),JSON.stringify({t:Date.now(),o})):localStorage.removeItem(DKEY())}catch{}}
function draftInit(){const f=$('rf');if(!f||PREVIEW)return;let d=null;try{d=JSON.parse(localStorage.getItem(DKEY())||'null')}catch{}
 if(d&&d.o&&Date.now()-d.t<30*864e5){const els=[...f.querySelectorAll('input,select,textarea')].filter(el=>el.type!=='file');
  const put=el=>{const k=draftKey(el);if(!k||!(k in d.o))return false;if(el.type==='checkbox'||el.type==='radio')el.checked=true;else el.value=d.o[k];return true};
  els.filter(el=>el.id!=='q-f_ptime').forEach(el=>{if(put(el)){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}});
  const pt=$('q-f_ptime');if(pt){ptUpdate();put(pt)}
  if(Object.keys(d.o).length>1){const n=document.createElement('p');n.className='fine draftnote';n.innerHTML='We kept what you typed last time. <button type="button" class="linkish" id="draftClear">Start over</button>';f.prepend(n);
   $('draftClear').onclick=()=>{try{localStorage.removeItem(DKEY())}catch{};form()}}}
 let tm;f.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(draftSave,400)});f.addEventListener('change',()=>{clearTimeout(tm);tm=setTimeout(draftSave,400)})}
const t12s=t=>{const[h,m]=t.split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`};
function slotTimes(from,to,step){const st=Math.max(15,+step||60),toM=v=>{const[h,m]=String(v||'').split(':').map(Number);return h*60+(m||0)};const out=[];for(let m=toM(from);m+st<=toM(to)+0.1&&out.length<48;m+=st)out.push(t12s(`${Math.floor(m/60)}:${m%60}`));return out}
function ptUpdate(){const w=$('ptWrap');if(!w)return;const sl=F().slots,sel=$('q-f_ptime'),msg=$('ptMsg'),d=$('f-date')&&$('f-date').value;
 w.hidden=!sl||handoff()!=='Pickup';if(w.hidden)return;const keep=sel.value;
 if(!d){sel.hidden=true;msg.textContent='Pick your event date to see pickup times.';return}
 const day=sl.days[new Date(d+'T12:00').getDay()],times=day?slotTimes(day.from,day.to,sl.step):[];
 sel.hidden=!times.length;msg.textContent=times.length?'':'No pickup times that day. Pick another date, or choose Delivery.';
 sel.innerHTML='<option value="">Choose a time…</option>'+times.map(t=>`<option${t===keep?' selected':''}>${esc(t)}</option>`).join('');if(!times.includes(keep))sel.value=''}
function leadMin(){const n=+(F().minDays)||0,d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function handoff(){const el=document.querySelector('[data-q="f_handoff"]');return el?el.value:''}
function qField(q){const i=q.id,id='q-'+i,lab=`${esc(q.q)}${req(q.required)}`;
 if(q.type==='long')return `<div class="field"><label for="${id}">${lab}</label><textarea id="${id}" data-q="${esc(i)}" maxlength="1000" style="min-height:80px"></textarea></div>`;
 if(q.type==='choice')return `<div class="field"><label for="${id}">${lab}</label><select id="${id}" data-q="${esc(i)}"><option value="">Choose…</option>${(q.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
 if(q.type==='yes')return `<div class="field"><span class="lbl">${lab}</span><div class="qyes"><label><input type="radio" name="${id}" data-q="${esc(i)}" value="Yes"> Yes</label><label><input type="radio" name="${id}" data-q="${esc(i)}" value="No"> No</label></div></div>`;
 return `<div class="field"><label for="${id}">${lab}</label><input type="text" id="${id}" data-q="${esc(i)}" maxlength="1000"></div>`}
function shown(q){if(!q.sec||q.sec==='_event')return true;if(q.sec==='_pick')return false;const s=F().secs.find(x=>x.id===q.sec);if(!s)return true;if(s.mode==='pick')return picked.has(s.id);if(s.mode==='delivery')return handoff()==='Delivery';return true}
function answers(){const c=F(),out=(info.questions||[]).map(q=>{let v='';if(!shown(q))return{id:q.id,q:q.q,a:'',required:false};if(q.type==='yes'){const x=document.querySelector(`input[data-q="${CSS.escape(q.id)}"]:checked`);v=x?x.value:''}else{const el=document.querySelector(`[data-q="${CSS.escape(q.id)}"]`);v=el?el.value.trim():''}return{id:q.id,q:q.q,a:v,required:q.required}});
 const pk=out.find(a=>a.id==='f_pick');if(pk)pk.a=c.secs.filter(s=>s.mode==='pick'&&picked.has(s.id)).map(s=>s.title+(s.price?` (${s.price})`:'')).join(', ');return out}
function sizeUp(){if(EMBED&&parent!==window)requestAnimationFrame(()=>parent.postMessage({type:'dcb-form-height',h:document.documentElement.scrollHeight},'*'))}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.pick){t.checked?picked.add(t.dataset.pick):picked.delete(t.dataset.pick);t.closest('.pick').classList.toggle('on',t.checked);sizeUp()}
 if(t.dataset&&t.dataset.q==='f_handoff'){const pk=$('pkNote');if(pk)pk.hidden=t.value!=='Pickup';ptUpdate();document.querySelectorAll('.rsec[data-mode="delivery"]').forEach(x=>x.hidden=t.value!=='Delivery');sizeUp()}});
const isFull=d=>!!d&&(info.full_dates||[]).includes(d);
let WAIT=false;
function dateNote(){const d=$('f-date')&&$('f-date').value,n=$('dmsg');if(!n)return;WAIT=false;if(isFull(d)){n.innerHTML='That date is fully booked. Pick another date, or <button type="button" class="linkish" id="waitBtn">join the waitlist for it</button>.';n.style.color='var(--rose-ink)'}else{n.textContent='';n.style.color=''}}
document.addEventListener('click',e=>{if(e.target.id!=='waitBtn')return;WAIT=true;const n=$('dmsg');n.textContent='You\'re asking to join the waitlist for this date. Send your request and we\'ll contact you if a spot opens.';n.style.color='var(--ink)'});
document.addEventListener('input',e=>{if(e.target.id==='f-date'){dateNote();ptUpdate()}});document.addEventListener('change',e=>{if(e.target.id==='f-date')ptUpdate()});
function drawPics(){const box=$('pics');if(!box)return;sizeUp();box.innerHTML=pics.map((p,i)=>`<div class="pic"><img src="${p.url}" alt="Inspiration photo ${i+1}"><button type="button" data-del="${i}" aria-label="Remove photo">✕</button></div>`).join('')+(pics.length<8?`<label class="pic add"><input type="file" id="picIn" accept="image/*" multiple hidden>+ Add photos</label>`:'')}

document.addEventListener('change',async e=>{if(e.target.id!=='picIn')return;const files=[...e.target.files].slice(0,8-pics.length);for(const f of files){if(!f.type.startsWith('image/'))continue;try{pics.push(await shrink(f))}catch{}}drawPics()});
document.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){pics.splice(+d.dataset.del,1);drawPics()}});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='rf')return;e.preventDefault();if(busy)return;
 const m=$('rmsg'),btn=e.target.querySelector('button[type=submit]');m.className='';m.textContent='';
 const name=$('f-name').value.trim(),email=$('f-email').value.trim(),details=(WAIT&&$('f-date').value&&isFull($('f-date').value)?`⏳ WAITLIST for ${new Date($('f-date').value+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} (fully booked when they asked).\n\n`:'')+$('f-details').value.trim();
 if($('f-web').value)return;
 const cf=F().f;if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.className='msg';m.textContent='Please add your name and a valid email.';return}
 const need=[[cf.phone.on&&cf.phone.req&&$('f-phone')&&!$('f-phone').value.trim(),'your phone number'],[cf.date.req&&!$('f-date').value,'the event date'],[cf.event.on&&cf.event.req&&$('f-event')&&!$('f-event').value,'the occasion'],[cf.servings.on&&cf.servings.req&&$('f-serv')&&!$('f-serv').value,'how many servings'],[cf.details.req&&!$('f-details').value.trim(),'what you would like'],[cf.photos.on&&cf.photos.req&&!pics.length,'at least one inspiration photo']].find(x=>x[0]);
 if(need){m.className='msg';m.textContent=`Please add ${need[1]}.`;return}
 if(isFull($('f-date').value)&&!WAIT){m.className='msg';m.innerHTML='That date is fully booked. Pick another date, or <button type="button" class="linkish" id="waitBtn">join the waitlist for it</button>.';$('f-date').focus();return}
 if($('f-date').value&&$('f-date').value<leadMin()){m.className='msg';m.textContent=`Please pick a date at least ${+F().minDays} day${+F().minDays===1?'':'s'} from today.`;$('f-date').focus();return}
 const ans=answers(),miss=ans.find(a=>a.required&&!a.a);if(miss){m.className='msg';m.textContent=`Please answer: ${miss.q}`;return}
 busy=true;btn.disabled=true;btn.textContent='Sending…';
 try{
  const paths=[];
  for(const p of pics){const path=`${info.shop_id}/requests/${crypto.randomUUID()}.jpg`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/shop-files/${path}`,{method:'POST',headers:{...H,'Content-Type':'image/jpeg','x-upsert':'false'},body:p.blob,signal:AbortSignal.timeout(30000)});if(r.ok)paths.push(path)}
  const r=await rpc('shop_submit_request',{p_slug:slug,p_name:name,p_email:email,p_phone:($('f-phone')&&$('f-phone').value.trim())||null,p_event_date:(WAIT?null:$('f-date').value)||null,p_event_type_id:($('f-event')&&$('f-event').value)||null,p_servings:$('f-serv')&&$('f-serv').value?+$('f-serv').value:null,p_details:details||'(No details given)',p_image_paths:paths,p_answers:ans.filter(a=>a.a).map(a=>({id:a.id,a:a.a}))});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.message||'send failed')}
  try{const rid=await r.clone().json();if(typeof rid==='string')fetch(`${SUPABASE_URL}/functions/v1/shop-notify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'request',id:rid}),keepalive:true}).catch(()=>{})}catch{}
  try{localStorage.removeItem(DKEY())}catch{}
  const PT=WEB()&&info.pro&&info.form&&info.form.look||{};const go=/^https:\/\/[^\s"'<>]+$/.test(PT.redirect||'')?PT.redirect:'';
  app.innerHTML=`<div class="done"><div class="big">${esc(PT.thanksTitle||'Request sent!')}</div><p class="muted" style="white-space:pre-wrap">${PT.thanks?esc(PT.thanks.replace(/\{name\}/g,name.split(' ')[0])):`Thank you, ${esc(name.split(' ')[0])}. ${esc(info.business)} will reply to ${esc(email)} soon.`}</p>${go?`<p><a class="btn primary" href="${esc(go)}" target="_top">Continue</a></p>`:''}</div>`;sizeUp();
  if(go)setTimeout(()=>{try{window.top.location.href=go}catch(e){location.href=go}},2500);
 }catch(err){m.className='msg';m.textContent=/fully booked/i.test(err.message)?'That date is fully booked. Please pick another date.':/too many/i.test(err.message)?'You have sent a few requests already. Please wait a little and try again.':/not taking/i.test(err.message)?'This shop is not taking requests right now.':'We couldn’t send your request. Please check your connection and try again.';btn.disabled=false;btn.textContent='Send my request'}
 finally{busy=false}
});

if(PREVIEW){document.documentElement.classList.add('pv');addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='dcb-form-preview')return;const nx=JSON.stringify(e.data.info);if(nx===lastPv)return;lastPv=nx;
  const keep={};document.querySelectorAll('#rf input:not([type=file]):not([type=radio]):not([type=checkbox]),#rf select,#rf textarea').forEach(x=>{const k=x.id||x.dataset.q;if(k&&x.value)keep[k]=x.value});document.querySelectorAll('#rf input[type=radio]:checked').forEach(x=>keep['r:'+x.name]=x.value);
  const y=scrollY;info=e.data.info;picked=new Set([...picked].filter(id=>(info.form&&info.form.secs||[]).some(s=>s.id===id)));form();
  Object.entries(keep).forEach(([k,v])=>{if(k.startsWith('r:')){const r=document.querySelector(`#rf input[name="${CSS.escape(k.slice(2))}"][value="${CSS.escape(v)}"]`);if(r)r.checked=true;return}const el=document.getElementById(k)||document.querySelector(`[data-q="${CSS.escape(k)}"]`);if(el)el.value=v});
  const ho=document.querySelector('[data-q="f_handoff"]');if(ho){document.querySelectorAll('.rsec[data-mode="delivery"]').forEach(x=>x.hidden=ho.value!=='Delivery');const pk=$('pkNote');if(pk)pk.hidden=ho.value!=='Pickup';ptUpdate()}scrollTo(0,y)});if(parent!==window)parent.postMessage({type:'dcb-form-ready'},location.origin)}
(async()=>{
 if(PREVIEW)return;
 if(!slug){info={shop_id:'preview',business:'your cake artist',accepting:true,event_types:[{id:'',name:'Birthday'},{id:'',name:'Wedding'}],questions:[{id:'p1',q:'Cake flavor',type:'choice',options:['Vanilla','Chocolate','Not sure yet']},{id:'p2',q:'Pickup or delivery?',type:'choice',options:['Pickup','Delivery'],required:true}],full_dates:[]};form();const n=document.createElement('p');n.className='msg';n.textContent='Preview: add ?shop=your-shop-link to the address to use a real order form.';app.prepend(n);const f=$('rf');f.addEventListener('submit',ev=>{ev.stopImmediatePropagation();ev.preventDefault();$('rmsg').className='msg';$('rmsg').textContent='Preview only. Nothing was sent.'},true);return}
 try{const r=await rpc('shop_form_info',{p_slug:slug});if(!r.ok)throw 0;info=await r.json();
  if(!info)return closed('Order form not found','Check the link you were given, or contact the cake artist directly.');
  if(!info.accepting)return closed(`${info.business} isn't taking requests right now`,'Please check back soon or contact them directly.');
  form();
  if(info.business)document.title='Order a cake from '+info.business;
  rpc('shop_reviews_public',{p_slug:slug}).then(r=>r.ok?r.json():null).then(j=>{const R=(j&&Array.isArray(j.reviews)?j.reviews:[]).filter(x=>x&&+x.rating>=1);if(!R.length||!app.querySelector('#rf'))return;
   const avg=R.reduce((a,x)=>a+ +x.rating,0)/R.length,top=R.filter(x=>+x.rating>=4&&x.body).slice(0,2);
   const d=document.createElement('div');d.className='rvs';d.innerHTML=`<p class="rvsum"><span class="st" aria-hidden="true">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> <b>${avg.toFixed(1)}</b> from ${R.length} review${R.length===1?'':'s'}</p>${top.map(x=>`<blockquote>“${esc(String(x.body).length>140?String(x.body).slice(0,137).trim()+'…':x.body)}”<cite>${esc(x.name||'')}</cite></blockquote>`).join('')}`;
   const t=app.querySelector('.rtop');(t&&!t.hidden?t:app.querySelector('#rf')).insertAdjacentElement(t&&!t.hidden?'afterend':'beforebegin',d)}).catch(()=>{});
  if(info.portfolio){const n=document.createElement('p');n.className='fine';n.style.margin='0 0 8px';n.innerHTML=`Looking for ideas? <a href="portfolio.html?shop=${encodeURIComponent(slug)}">See ${esc(info.business)}'s cakes</a>`;app.querySelector('.lead').after(n)}
 }catch{closed('We couldn’t load the order form','Please check your connection and try again.')}
})();
}
