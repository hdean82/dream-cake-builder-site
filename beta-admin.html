<style>
h1,h2,h3,label,.btn,summary{text-transform:none}
.bwrap{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
.bhero{display:grid;gap:28px;align-items:center}
@media(min-width:860px){.bhero{grid-template-columns:1.05fr .95fr}}
.bhero h1{font-size:clamp(34px,5vw,54px);line-height:1.04;letter-spacing:-.02em;margin:14px 0 0;max-width:14ch}
.bhero .lede{font-size:17px;line-height:1.6;color:var(--muted);margin-top:14px;max-width:52ch}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--rose-ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.bimg{border-radius:26px;overflow:hidden;background:#e1ddde;aspect-ratio:1400/1017;box-shadow:0 30px 60px -32px #4b103d66}
.bimg img{width:100%;height:100%;object-fit:contain}
.perks{display:grid;gap:14px;margin:44px 0}
@media(min-width:760px){.perks{grid-template-columns:repeat(3,1fr)}}
.perk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.perk b{display:block;font:600 19px Fraunces,Georgia,serif;margin-bottom:6px}
.perk p{color:var(--muted);line-height:1.55}
.card.bform{padding:24px;border-radius:24px}
.bform h2{font-size:26px;margin-bottom:6px}
.bform .sub{color:var(--muted);margin-bottom:18px}
.fgrid{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.fgrid label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.fgrid label i{font-style:normal;font-weight:400;color:var(--muted)}
.fgrid input,.fgrid textarea,.fgrid select{font:inherit;font-weight:400;font-size:16px;padding:11px 12px;border:1px solid #e3c3d4;border-radius:10px;background:#fff;color:var(--ink);width:100%}
.fgrid textarea{resize:vertical;min-height:110px}
.send{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.send .btn{min-height:48px;padding:0 24px;font-weight:600}
.st{font-size:14px}.st.bad{color:#b3261e}.st.good{color:#22703c}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.welcome{background:var(--ink);color:#fff;border-radius:24px;padding:26px;margin-bottom:28px}
.welcome h2{color:#fff;font-size:28px}.welcome p{color:#f3d9e6;margin-top:8px;line-height:1.6}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.welcome .btn:not(.primary){background:transparent;color:#fff;border-color:#ffffff66}

.tabs2{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.it .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.it b{font-size:16px}.it .m{color:var(--muted);font-size:13.5px}
.it .tx{white-space:pre-wrap;line-height:1.55}
.it .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tag2{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--rose-soft);color:var(--rose-ink)}
.tag2.ok{background:#e3f5e8;color:#22703c}.tag2.off{background:#eee;color:#666}
.empty{color:var(--muted);padding:18px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px}
.sel{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #e3c3d4;border-radius:10px;background:#fff}
.it textarea{font:inherit;font-size:15px;padding:9px 11px;border:1px solid #e3c3d4;border-radius:10px;width:100%;min-height:60px;resize:vertical}
.it details summary{cursor:pointer;font-weight:600;color:#9a1b5f;font-size:14px}
.hist{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13.5px;max-height:320px;overflow:auto}
.hist div{display:flex;gap:10px}.hist time{color:var(--muted);flex:none;width:120px}
.tag2.sent{background:#f6eef3;color:#6c3b5f}.tag2.reviewing{background:#eaf3ff;color:#244d84}.tag2.in_progress{background:#fff2d6;color:#7a5410}.tag2.completed{background:#ffe3f0;color:#9a1b5f}.tag2.wontfix{background:#eee;color:#666}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}.kv span{color:var(--muted)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.addrow input{flex:1 1 200px;font:inherit;padding:10px 12px;border:1px solid #e3c3d4;border-radius:10px}

</style>
</head>

<main class="bwrap">
 <h1 style="font-size:34px">Beta</h1>
 <p class="lede" style="color:var(--muted);margin-top:6px">Requests to join, your testers, and everything they've reported.</p>
 <p class="st bad" id="aErr" hidden></p>
 <div id="aBody" hidden>
  <div class="tabs2" role="tablist"><button class="on" data-t="reports">Reports <span id="nR"></span></button><button data-t="apps">Requests <span id="nA"></span></button><button data-t="testers">Testers <span id="nT"></span></button><button data-t="activity">Activity</button></div>
  <section data-p="reports"><div class="addrow"><input id="rq" type="search" placeholder="Search reports"><select id="rs" style="font:inherit;padding:10px;border:1px solid #e3c3d4;border-radius:10px"><option value="">Any status</option><option value="sent">Sent</option><option value="reviewing">Reviewing</opt<script src="assets/dcb-auth.js"></script>
<script>
(function(){const FN='https://gcorvodfcxhumesttwvj.supabase.co/functions/v1/beta',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),when=d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
 const ST=[['sent','Sent'],['reviewing','Reviewing'],['in_progress','In progress'],['completed','Completed 💗'],['wontfix','Not planned']],SL=Object.fromEntries(ST),KIND={bug:'Problem',idea:'Idea',question:'Question'};
 const KH={joined:'🎉',invited:'✉️',visit:'👀',report:'📝',me_too:'🙋',status:'🔄',team_note:'💬',paused:'⏸',resumed:'▶️'};
 let tok='',D={applications:[],testers:[],reports:[],activity:[]};
 const api=async b=>{const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!j.ok)throw new Error(j.error||'Something went wrong.');return j};
 const err=t=>{$('aErr').innerHTML=t;$('aErr').hidden=!t};
 const tn=()=>Object.fromEntries(D.testers.map(t=>[t.id,t.name||t.email]));
 function reps(){const n=tn(),q=($('rq').value||'').toLowerCase(),fs=$('rs').value;const rows=D.reports.filter(r=>(!fs||r.status===fs)&&(!q||(r.title+' '+r.what+' '+r.area+' #'+r.id+' '+(n[r.tester_id]||'')).toLowerCase().includes(q)));
  $('lR').innerHTML=rows.length?rows.map(r=>`<div class="it"><div class="top"><b>${KIND[r.kind]} #${r.id}: ${esc(r.title||'')}</b><span class="tag2 ${r.status}">${SL[r.status]||r.status}</span></div><div class="m">${esc(n[r.tester_id]||'Tester')} · ${esc(r.area||'')} · ${when(r.created_at)}${r.votes?' · <b>'+r.votes+' me too</b>':''}</div><div class="tx">${esc(r.what)}</div>${r.expected?`<div class="m"><b>${r.kind==='bug'?'Expected':'Why it helps'}:</b> ${esc(r.expected)}</div>`:''}<div class="m">${esc(r.page)}<br>${esc(r.device||'')}</div>
  <label class="m" style="display:flex;flex-direction:column;gap:4px;margin-top:4px"><b>Note to testers</b> (everyone in the beta sees this)<textarea data-note="${r.id}" maxlength="2000" placeholder="e.g. Thanks! Fixed in today's update.">${esc(r.team_note||'')}</textarea></label>
  <div class="acts"><select class="sel" data-st="${r.id}" aria-label="Status">${ST.map(([k,l])=>`<option value="${k}"${k===r.status?' selected':''}>${l}</option>`).join('')}</select><button class="btn sm primary" data-save="${r.id}">Save</button><span class="m" data-ok="${r.id}"></span></div><p class="m">Choosing Completed emails ${esc(n[r.tester_id]||'the tester')} with a pink heart.</p></div>`).join(''):'<div class="empty">No reports match.</div>'}
 function render(){const n=tn();
  const open=D.reports.filter(r=>r.status==='sent').length;$('nR').textContent=open?'('+open+' new)':'';$('nA').textContent=D.applications.filter(a=>a.status==='new').length?'('+D.applications.filter(a=>a.status==='new').length+')':'';$('nT').textContent='('+D.testers.filter(t=>t.active).length+')';
  reps();
  $('lA').innerHTML=D.applications.length?D.applications.map(a=>`<div class="it"><div class="top"><b>${esc(a.name)}${a.business?' · '+esc(a.business):''}</b><span class="tag2 ${a.status==='invited'?'ok':a.status==='declined'?'off':''}">${{new:'New',invited:'Invited',declined:'Declined'}[a.status]}</span></div><div class="kv"><span>Email</span>${esc(a.email)}<span>Instagram or site</span>${esc(a.social||'')}<span>Makes</span>${esc(a.cakes||'')}<span>Uses</span>${esc(a.devices||'')}<span>Sent</span>${when(a.created_at)}</div>${a.why?`<div class="tx">${esc(a.why)}</div>`:''}<div class="acts">${a.status!=='invited'?`<button class="btn sm primary" data-inv="${a.id}">Invite</button>`:''}${a.status==='new'?`<button class="btn sm" data-dec="${a.id}">Decline</button>`:''}</div></div>`).join(''):'<div class="empty">No requests yet.</div>';
  $('lT').innerHTML=D.testers.length?D.testers.map(t=>{const mine=D.reports.filter(r=>r.tester_id===t.id);return `<div class="it"><div class="top"><b>${esc(t.name||t.email)}${t.business?' · '+esc(t.business):''}</b><span class="tag2 ${t.active?'ok':'off'}">${t.active?'Active':'Paused'}</span></div><div class="kv"><span>Email</span>${esc(t.email)}<span>Account</span>${t.user_id?'Linked ✓':'Not linked yet'}<span>Instagram or site</span>${esc(t.social||'–')}<span>Makes</span>${esc(t.cakes||'–')}<span>Uses</span>${esc(t.devices||'–')}<span>Last seen</span>${t.last_seen?when(t.last_seen):'not opened yet'}<span>Reports</span>${mine.length} sent, ${mine.filter(r=>r.status==='completed').length} completed</div><details data-hist="${t.id}"><summary>History</summary><div class="hist" id="h${t.id}">Loading…</div></details><div class="acts"><button class="btn sm" data-copy="https://www.dreamcakebuilder.com/beta?code=${esc(t.code)}">Copy their link</button><button class="btn sm" data-act="${t.id}" data-on="${t.active?0:1}">${t.active?'Pause':'Turn back on'}</button></div></div>`}).join(''):'<div class="empty">No testers yet.</div>';
  $('lH').innerHTML=(D.activity||[]).length?'<div class="it"><div class="hist" style="max-height:none">'+D.activity.map(h=>`<div><time>${when(h.at)}</time><span>${KH[h.kind]||'•'} <b>${esc(n[h.tester_id]||'Tester')}</b> ${esc(h.detail)}</span></div>`).join('')+'</div></div>':'<div class="empty">Nothing yet.</div>'}
 async function load(){try{const j=await api({action:'admin_list'});D=j;render();$('aBody').hidden=false;err('')}catch(e){err(esc(e.message))}}
 document.addEventListener('toggle',async e=>{const d=e.target;if(!d.dataset||!d.dataset.hist||!d.open)return;const j=await api({action:'admin_history',id:+d.dataset.hist}).catch(()=>({activity:[]}));$('h'+d.dataset.hist).innerHTML=j.activity.length?j.activity.map(h=>`<div><time>${when(h.at)}</time><span>${KH[h.kind]||'•'} ${esc(h.detail)}</span></div>`).join(''):'Nothing yet.'},true);
 ['input','change'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==='rq'||e.target.id==='rs')reps()}));
 document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.closest('.tabs2')){document.querySelectorAll('.tabs2 button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!==b.dataset.t);return}
  try{if(b.dataset.save){const id=b.dataset.save,st=document.querySelector(`[data-st="${id}"]`).value,note=document.querySelector(`[data-note="${id}"]`).value;b.disabled=true;await api({action:'admin_report',id:+id,status:st,team_note:note});const r=D.reports.find(x=>x.id==id);r.status=st;r.team_note=note;document.querySelector(`[data-ok="${id}"]`).textContent='Saved'+(st==='completed'?' 💗':'');b.disabled=false;setTimeout(load,800)}
   else if(b.dataset.inv){const a=D.applications.find(x=>x.id==b.dataset.inv);if(!confirm('Invite '+a.name+' and email them their beta link? This also makes their Dream Cake Builder account with the details from their request.'))return;b.disabled=true;const j=await api({action:'admin_invite',email:a.email,name:a.name,application_id:a.id});alert(j.emailed?'Invite sent to '+a.email+'.':'Added, but the email didn\'t send. Their link: '+j.link);await load()}
   else if(b.dataset.dec){await api({action:'admin_app',id:+b.dataset.dec,status:'declined'});await load()}
   else if(b.dataset.act){await api({action:'admin_tester',id:+b.dataset.act,active:b.dataset.on==='1'});await load()}
   else if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'}}catch(x){err(esc(x.message));b.disabled=false}});
 $('addT').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!confirm('Invite '+(d.name||d.email)+' and email them their beta link?'))return;try{const j=await api({action:'admin_invite',email:d.email,name:d.name});e.target.reset();alert(j.emailed?'Invite sent to '+d.email+'.':'Added, but the email didn\'t send. Their link: '+j.link);await load()}catch(x){err(esc(x.message))}});
 (async()=>{try{const s=await DCBAuth.session();if(!s||!s.access_token){err('Sign in with the owner account first. <a href="account.html?next=/beta-admin">Sign in</a>');return}tok=s.access_token;load()}catch(e){err('Sign in with the owner account first. <a href="account.html?next=/beta-admin">Sign in</a>')}})();
})();
</script>.t);return}
  try{if(b.dataset.rep){await api({action:'admin_report',id:+b.dataset.rep,status:b.dataset.s});await load()}
   else if(b.dataset.inv){const a=D.applications.find(x=>x.id==b.dataset.inv);if(!confirm('Invite '+a.name+' and email them their beta link?'))return;b.disabled=true;const j=await api({action:'admin_invite',email:a.email,name:a.name,application_id:a.id});alert(j.emailed?'Invite sent to '+a.email+'.':'Added, but the email didn\'t send. Their link: '+j.link);await load()}
   else if(b.dataset.dec){await api({action:'admin_app',id:+b.dataset.dec,status:'declined'});await load()}
   else if(b.dataset.act){await api({action:'admin_tester',id:+b.dataset.act,active:b.dataset.on==='1'});await load()}
   else if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'}}catch(x){err(esc(x.message))}});
 $('addT').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!confirm('Invite '+(d.name||d.email)+' and email them their beta link?'))return;try{const j=await api({action:'admin_invite',email:d.email,name:d.name});e.target.reset();alert(j.emailed?'Invite sent to '+d.email+'.':'Added, but the email didn\'t send. Their link: '+j.link);await load()}catch(x){err(esc(x.message))}});
 (async()=>{try{const s=await DCBAuth.session();if(!s||!s.access_token){err('Sign in with the owner account first. <a href="account.html">Sign in</a>');return}tok=s.access_token;load()}catch(e){err('Sign in with the owner account first. <a href="account.html">Sign in</a>')}})();
})();
</script>
