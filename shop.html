<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · Dream Cake Builder</title>
<link rel="icon" href="lilac/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dcb-theme.css">
<style>
/* VOICE: the back office of Dream Cake Studio, calm and practical
   IDEA: a bakery order book with tabbed sections
   PICTURE: the working forms and lists themselves
   COLOUR and TYPE: studio cream, off-white panels, dusty rose; Fraunces + Inter
   LAYOUT: studio grid: 56px header, section #nav, work area, live summary panel */
:root{color-scheme:light;--bg:#fff4ed;--panel:#fffaf5;--ink:#4b103d;--muted:#79536e;--line:#eed3e3;--rose:#c12c7e;--rose-soft:#fde3f0;--rose-ink:#9a1b5f;--teal:#177d79;--ok:#2f7d5b;--ok-soft:#e5f2ec;--radius:12px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:#d9bfc6;background:#fffafb}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:#b14f6f}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12.5px}
.btn.danger{color:#a3324f}
.btn.wide{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
#nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;margin-bottom:2px}
.navbtn svg{width:18px;height:18px;flex-shrink:0}
.navbtn:hover{background:#fff4f7;color:var(--ink)}
.navbtn.on{background:var(--rose-soft);color:var(--rose-ink)}
.navsec{font-size:11.5px;color:var(--muted);margin:14px 10px 6px;font-weight:600}
main{overflow:auto;padding:20px 22px 60px}
aside{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:16px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:26px;margin:0 0 4px;line-height:1.15}
h2{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin:0 0 4px}
h3{font-family:Fraunces,serif;font-weight:600;font-size:15px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px;max-width:640px}
.hint{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.wrap{max-width:860px;margin:0;padding:0}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px 18px;margin-bottom:14px}
.card.white{background:#fff}
.cardhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.cardhead>div{flex:1}.cardhead>.emo,.dhead>.emo{flex:0 0 38px}
.field{margin:10px 0}
.field>label,.lbl{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.req{color:var(--rose)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
select,input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%;min-height:36px}
textarea{resize:vertical;min-height:84px}
textarea.code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:260px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--rose-soft);border-color:#e6b4c4;color:var(--rose-ink);font-weight:500}
.rows{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.rowi:first-child{border-top:0}
button.rowi:hover{background:#fffafb}
.rowi .ico{width:34px;height:34px;border-radius:9px;background:var(--rose-soft);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.rowi .ico svg{width:18px;height:18px}
.rowi .bd{flex:1}
.rowi .t{font-weight:500}
.rowi .d{color:var(--muted);font-size:12.5px}
.rowi .v{color:var(--muted);white-space:nowrap}
.chev{color:var(--muted)}
.pill{font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 10px;background:#f3ecea;color:var(--ink);white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:#fff;border:1px solid var(--line);color:var(--muted)}
.sw2{position:relative;display:inline-block;width:40px;height:23px;flex-shrink:0}
.sw2 input{opacity:0;width:0;height:0;position:absolute}
.sw2 i{position:absolute;inset:0;background:#ddd0cd;border-radius:999px;cursor:pointer;transition:background .15s}
.sw2 i:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw2 input:checked+i{background:var(--rose)}
.sw2 input:checked+i:before{transform:translateX(17px)}
.sw2 input:focus-visible+i{outline:2px solid var(--rose);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:8px 0}
.toggle>div{flex:1}
.toggle .t{font-weight:500}
.toggle .d{color:var(--muted);font-size:12.5px}
.addbar{display:flex;gap:8px;margin:8px 0}
.addbar input{flex:1}
.li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 8px 7px 12px;margin-top:6px}
.li .nm{flex:1}
.li input[type=text]{border-color:transparent;background:transparent;padding:4px 6px}
.li input[type=text]:hover,.li input[type=text]:focus{border-color:var(--line);background:#fff}
.mv{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.mv:hover{background:#f6eeee;color:var(--ink)}
.mv.del:hover{color:#a3324f;background:#fbe9ee}
.mv[disabled]{opacity:.3;cursor:default}
.emo{width:38px;height:38px;border-radius:10px;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.colors{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.colors button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.colors input[type=color]{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.empty svg{width:34px;height:34px;display:block;margin:0 auto 6px;color:#c9aab3}
.item{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;margin-top:8px}
.item .top{display:flex;gap:10px;align-items:baseline}
.item .top b{flex:1;font-weight:600}
.item .price{font-weight:600;color:var(--rose-ink);white-space:nowrap}
.item ul{margin:6px 0 8px;padding-left:18px;color:var(--muted);font-size:12.5px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;font-weight:600;font-size:14px}
.kv.tot span:first-child{color:var(--ink)}
.big{font-family:Fraunces,serif;font-size:26px;font-weight:600}
.pays{background:var(--rose-soft);border-radius:10px;padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.pays b{font-family:Fraunces,serif;font-size:22px;color:var(--rose-ink)}
.sticky{position:sticky;bottom:-60px;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;display:flex;gap:8px}
.sticky .primary{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;cursor:pointer;font-size:12.5px;text-align:center}
.tile:hover{border-color:#e6b4c4;background:var(--rose-soft)}
.tile .e{font-size:26px;line-height:1}
.tierchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tierchips .seg button{font-weight:500}
.preview{background:#fff7f9;border:1px solid #f0cdd8;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12.5px}
.preview b{color:var(--rose-ink)}
.modal{position:fixed;inset:0;background:rgba(40,25,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.dialog{background:var(--panel);border-radius:16px;max-width:620px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dhead{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead>div{flex:1}.dhead>.emo{flex:0 0 38px}
.dbody{overflow:auto;padding:4px 18px 16px}
.dfoot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.dfoot .primary{flex:1}
.dfoot .note{font-size:12px;color:var(--muted)}
.mail{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.mail .mh{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.mail .mh b{color:var(--ink);font-weight:600}
.mail .mb{padding:14px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.mail mark{background:var(--rose-soft);color:var(--rose-ink);border-radius:4px;padding:0 3px}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vars button{border:1px solid var(--line);background:#fff;border-radius:6px;font:11.5px ui-monospace,Menlo,monospace;padding:3px 6px;cursor:pointer;color:var(--rose-ink)}
.vars button:hover{background:var(--rose-soft)}
.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:8px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.status{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--rose-soft);color:var(--rose-ink);white-space:nowrap}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;white-space:nowrap}
.toast.on{opacity:1}
.toast button{background:none;border:0;color:#f7c6d6;font-weight:600;cursor:pointer;margin-left:8px}
.note{font-size:11.5px;color:var(--muted)}

/* photos, tags, document */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .del{position:absolute;top:4px;right:4px;background:#fffd;width:26px;height:26px}
.pic.add{display:flex;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;color:var(--rose-ink);font-weight:500;font-size:13px;text-align:center;padding:6px}
.pic.add:hover{background:var(--rose-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px}
.tagchip button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%}
.tagchip button:hover{background:#fbe9ee;color:#a3324f}
.dialog.wide{max-width:820px}
.doc{background:#fff;border-radius:10px;box-shadow:0 4px 18px #4b103d1a;padding:24px 26px;font-size:13.5px;color:#2f1a2a}
.dtop{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--acc,var(--rose));padding-bottom:12px;margin-bottom:14px}
.dbrand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;color:var(--acc,var(--rose-ink))}
.dno{text-align:right;display:flex;flex-direction:column}.dno b{font-family:Fraunces,Georgia,serif;font-size:20px}.dno span{color:var(--muted)}
.dmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.dmeta b{display:block}
.dtable{width:100%;border-collapse:collapse;margin-bottom:10px}
.dtable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 4px}
.dtable td{border-bottom:1px solid #f3e6ee;padding:8px 4px;vertical-align:top}
.dtable .n{text-align:right;white-space:nowrap}
.dtot{margin-left:auto;max-width:300px;margin-bottom:12px}
.dpics{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.dpics img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.doc .lbl{margin-top:8px}
.docfoot{text-align:center;color:var(--acc,var(--rose-ink));font-family:Fraunces,Georgia,serif;margin:14px 0 0}
@media (max-width:600px){.doc{padding:16px}.dmeta{grid-template-columns:minmax(0,1fr)}}
@media print{body.printing *{visibility:hidden}body.printing #docPrint,body.printing #docPrint *{visibility:visible}body.printing #docPrint{position:absolute;left:0;top:0;width:100%;box-shadow:none}}
/* option prices */
.optprice{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:13px}
.optprice input{width:78px;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:#fff}
.suggest{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--teal-soft,#dff3f1);color:var(--teal,#177d79);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}
@media (max-width:600px){.li:has(.optprice){flex-wrap:wrap}.li:has(.optprice) .nm{flex:1 1 100%}}
.cday .n .full{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;color:#a3324f;background:#fdeaee;border-radius:5px;padding:0 5px;vertical-align:1px}
.cday .n .full.wk{color:#8a5a00;background:#fff4dc}
@media (max-width:600px){.cday .n .full{display:block;margin:2px 0 0;font-size:9px;width:max-content}}
.hist summary{cursor:pointer;list-style:none}.hist summary::-webkit-details-marker{display:none}
.hlist{display:grid;gap:4px;margin-top:8px}
.hrow{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}.hrow:first-child{border-top:0}
.hdate{color:var(--muted);white-space:nowrap;min-width:118px}
.setup .bar{height:8px;border-radius:8px;background:var(--rose-soft);overflow:hidden;margin-top:8px}.setup .bar i{display:block;height:100%;background:var(--rose)}
.setup .trow{width:100%;text-align:left;font:inherit;color:inherit}
.sdot{width:24px;height:24px;border-radius:50%;background:var(--rose-soft);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.trow.done .sdot{background:#e7f5f2;color:#177d79}
.suprices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.suprices .li{justify-content:space-between}
@media (max-width:480px){.suprices{grid-template-columns:minmax(0,1fr)}}
/* countdown & today */
.tlist{display:grid;gap:6px}
.trow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.trow input{accent-color:var(--teal,#177d79);width:19px;height:19px;flex-shrink:0}
.trow .tb{display:flex;flex-direction:column;flex:1;min-width:0}
.trow .tdue{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.trow.late .tdue{color:#a3324f;font-weight:600}
.trow.done{opacity:.55}.trow.done b{text-decoration:line-through}
.plan .rows{margin-top:4px}
@media (max-width:520px){.trow{flex-wrap:wrap}.trow .tdue{width:100%;text-align:left;padding-left:29px}}
/* cloud status */
.cloudchip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:-4px 0 10px;color:var(--muted)}
.cloudchip .cc{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:500;color:var(--muted)}
.cloudchip .cc.ok{color:var(--teal,#177d79);border-color:#bfe3dd;background:#f3fbf9}
.cloudchip .cc.warn{color:#a3324f;border-color:#f0c3cf;background:#fff5f7}
.cloudchip a,.cloudchip .linkbtn{color:var(--rose-ink);font-size:12.5px}
.linkbtn{border:0;background:none;cursor:pointer;text-decoration:underline;padding:2px 0;font:inherit}
/* requests */
.rq{padding:12px 14px}
.rqhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rqhead b{font-size:15px}
.rqmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px}
.rqmeta span{display:inline-flex;align-items:center;gap:5px}
/* money */
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mstat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;margin:0}
.mstat b{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;white-space:nowrap}
.mstat.pos b{color:var(--teal,#177d79)}.mstat.neg b{color:#a3324f}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 90px;gap:8px;align-items:center;padding:4px 0}
.ml{font-size:12.5px;color:var(--muted)}
.mbars{display:flex;flex-direction:column;gap:3px}
.mbars i{display:block;height:9px;border-radius:5px;min-width:2px}
.mbars .in{background:var(--teal,#177d79)}.mbars .out{background:var(--rose)}
.mv2{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
@media (max-width:700px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* bake sheet */
.bday{margin-bottom:14px}.bday h2{font-size:18px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.bcard{padding:10px 12px;margin-bottom:8px}
.bhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}.bhead b{font-size:15px}.bhead .noprint{margin-left:auto}
.bitem{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-top:6px;cursor:pointer}
.bitem input{accent-color:var(--teal);width:19px;height:19px;margin-top:2px;flex-shrink:0}
.bitem span{display:flex;flex-direction:column;gap:1px}
.bitem.done{opacity:.55}.bitem.done b{text-decoration:line-through}
.knote{font-size:13px;margin:6px 2px 0;color:var(--ink)}.knote b{color:var(--rose-ink)}
.mnote{border-radius:9px;padding:7px 10px;font-size:13px;margin:0 0 8px;font-weight:500}
.mnote.good{background:#e7f5f2;color:#177d79}.mnote.warn{background:#fff4dc;color:#8a5a00}.mnote.bad{background:#fdeaee;color:#a3324f}

.rqformcard{padding-top:12px}
.rqform-body>.card{box-shadow:none;margin:12px 0 0}
.rqpills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.rqpills::-webkit-scrollbar{display:none}
.rqpills button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px;transition:background-color .15s,color .15s,border-color .15s}
.rqpills button:hover{border-color:#e2b4ca}
.rqpills button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.rqpills .n{font-size:11.5px;font-weight:600;background:var(--rose-soft);color:var(--rose-ink);border-radius:999px;padding:1px 7px}
.rqpills button.on .n{background:#ffffff33;color:#fff}
.rqlist{display:grid;gap:12px}
.rq{padding:0;margin:0}
.rq[hidden]{display:none}
.rqsum{display:block;padding:16px 18px;cursor:pointer;list-style:none}
.rqsum::-webkit-details-marker{display:none}
.rqtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rqwhen{font-size:12.5px;color:var(--muted)}
.rqst{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 12px;text-transform:none}
.rqst.new{background:#e3f5e8;color:#22703c}.rqst.replied{background:#e6edfb;color:#3657a8}.rqst.quoted{background:var(--rose-soft);color:var(--rose-ink)}.rqst.declined{background:#f1ecee;color:#7d6a72}
.rqname{display:block;font-size:17px;font-weight:600;margin-bottom:4px}
.rqev{display:flex;align-items:center;gap:7px;color:var(--muted);margin-bottom:6px}
.rqev .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.rqdate{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:6px}
.rqdate svg,.rqfoot svg{width:17px;height:17px;flex-shrink:0}
.rqprev{margin:6px 0 0;color:#6d4f63;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rq[open] .rqprev{display:none}
.rqfoot{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.rqfoot span{display:inline-flex;align-items:center;gap:6px}
.rqbody{padding:0 18px 16px;border-top:1px dashed var(--line);animation:dcb-pop .18s ease-out}
.rqbody>.note:first-child{margin-top:12px}
.rq[open]>.rqsum{background:#fffafc;border-radius:var(--radius) var(--radius) 0 0}

/* ===== reorderable lists, event colors, product rows (BakeGenie style) ===== */
.dlist{display:grid;gap:10px;margin-top:8px}
.drow{display:flex;align-items:center;gap:6px;position:relative;transition:transform .18s cubic-bezier(.2,0,0,1)}
.dlist.sorting .drow{transition:transform .18s cubic-bezier(.2,0,0,1)}
.drow.dragging{transition:none;z-index:5}
.drow.dragging>:not(.grip){box-shadow:0 10px 28px #4b103d2e;transform:scale(1.01)}
.drow>.li,.drow>.evcard,.drow>.tycard{flex:1;margin:0}
.grip{flex-shrink:0;width:30px;height:44px;border:0;background:none;color:#b997ac;border-radius:8px;cursor:grab;touch-action:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
.grip:hover{color:var(--rose);background:var(--rose-soft)}
.grip:active{cursor:grabbing}
.grip svg{width:18px;height:18px}
.trash,.gear{flex-shrink:0;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.trash svg,.gear svg{width:19px;height:19px}
.trash:hover{color:#b42d4f;background:#fdecef}
.gear{border-color:var(--line);background:#fff;color:var(--ink);width:46px;height:42px}
.gear:hover{border-color:#e2b4ca;background:#fffafb}
.colors.pills{gap:8px}
.colors.pills>button{width:30px;height:46px;border-radius:999px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.colors.pills>button.on{box-shadow:0 0 0 3px var(--ink)}
.cpick{position:relative;width:46px;height:46px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;overflow:hidden}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.evcard{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 35%,#fff);background:color-mix(in srgb,var(--c) 6%,#fff)}
.evcard .nm{flex:1;border:0;background:transparent;font-size:15.5px;font-weight:500;padding:8px 4px}
.evcard .nm:focus{background:#fff;outline:1px solid var(--line)}
.evdot{position:relative;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 4px color-mix(in srgb,var(--c) 40%,#fff);flex-shrink:0;cursor:pointer}
.evdot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tyhead{display:flex;justify-content:space-between;padding:14px 64px 4px 104px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tycard{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.tycard .emo{width:52px;height:52px;border-radius:12px;background:#fdeff6;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.tycard .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.tycard .t{font-weight:600;font-size:16px}
.tycard .d{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
.tycard.off{background:#fffdfb}
.tycard.off .emo{filter:grayscale(.5);opacity:.75}
.tick{position:relative;width:30px;height:30px;flex-shrink:0;cursor:pointer}
.tick input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.tick i{position:absolute;inset:0;border-radius:8px;border:2px solid #e2b4ca;background:#fff;transition:background-color .15s,border-color .15s;pointer-events:none}
.tick input:checked+i{background:var(--rose);border-color:var(--rose)}
.tick input:checked+i:after{content:"";position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tick input:focus-visible+i{outline:2px solid var(--rose);outline-offset:2px}
.optlist .li{padding-right:4px}
@media (max-width:600px){.tyhead{padding-left:44px;padding-right:56px}.tycard{gap:10px;padding:10px}.tycard .emo{width:44px;height:44px;font-size:24px}}
@media (prefers-reduced-motion:reduce){.drow{transition:none}}

/* ===== Order page: header with status + ⋮ actions, at-a-glance facts, section icons ===== */
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.otitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.otitle h1{margin:0}
.ostat{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 12px;background:var(--rose-soft);color:var(--rose-ink);text-transform:none}
.ostat.st-confirmed,.ostat.st-booked,.ostat.st-paid{background:#e3f5e8;color:#22703c}
.ostat.st-inquiry,.ostat.st-quote-sent{background:#e6edfb;color:#3657a8}
.ostat.st-cancelled{background:#f1ecee;color:#7d6a72}
.ostat.st-baking{background:#fff3d6;color:#8a5a00}.ostat.st-ready{background:#dff3f1;color:#177d79}
.ostat.st-completed{background:#efe8fb;color:#5b3d9c}
.oacts{display:flex;align-items:center;gap:6px}
.kebab{position:relative}
.kebab>summary{list-style:none;width:40px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink)}
.kebab>summary::-webkit-details-marker{display:none}
.kebab>summary svg{width:20px;height:20px}
.kebab[open]>summary,.kebab>summary:hover{background:var(--rose-soft);border-color:#e6b4c4}
.kmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:230px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #4b103d26;animation:dcb-pop .16s ease-out}
.kmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;cursor:pointer;font-weight:500;color:var(--ink)}
.kmenu button svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.kmenu button:hover{background:var(--rose-soft);color:var(--rose-ink)}
.kmenu button.danger,.kmenu button.danger svg{color:#b42d4f}
.kmenu button.danger:hover{background:#fdecef}
.kmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.ofacts{margin-top:10px}
.ofacts .due{color:#b42d4f;font-weight:600}
.only-sm{display:none}
@media (max-width:900px){.only-sm{display:block}}
h3.hico{display:flex;align-items:center;gap:8px}
.hic{width:26px;height:26px;border-radius:8px;background:var(--rose-soft);color:var(--rose-ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.hic svg{width:16px;height:16px}

/* ===== Add-item form (BakeGenie style) ===== */
.ichead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ichead h3{margin:0}
.ichead .pill{font-family:Inter,system-ui,sans-serif;font-size:11.5px;font-weight:600}
.tierpills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tierpills button{border:1px solid #f0c2d6;background:#fff;color:var(--rose-ink);border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:40px;transition:background-color .15s,color .15s}
.tierpills button.on{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 3px 10px #c12c7e40}
.tierpills .tdel{border-color:transparent;color:#b42d4f;font-weight:500;background:none;margin-left:auto}
.tierpills .tdel:hover{background:#fdecef}
.tprev{margin-top:14px;border-radius:12px;border:1px solid #f6d3b4;background:linear-gradient(180deg,#fff6ec,#fffaf5);padding:12px 14px;animation:dcb-pop .18s ease-out}
.tp-h{font-weight:600;color:#b4571c;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tp-h:before{content:"🎂"}
.tp-chips{display:flex;flex-wrap:wrap;gap:6px}
.tp-chip{background:#ffe3cc;color:#8a4310;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:500}
.tp-empty{margin:0;color:#a0714f;font-size:13px}
.tp-notes{margin-top:10px;background:#fff;border:1px solid #f0dfd0;border-radius:10px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.tp-notes b{display:block;color:#6b6bd9;font-size:12px;margin-bottom:2px}
.tp-others{margin-top:10px;padding-top:8px;border-top:1px dashed #f0d0b5;font-size:12.5px;color:#7a5a45;display:grid;gap:2px}
.psum .pays.big{align-items:center;padding:14px 16px}
.pays.big span{display:flex;flex-direction:column;font-weight:600}
.pays.big small{font-weight:400;color:var(--muted);font-size:12px;text-transform:none}
.pays.big b{font-size:26px;color:#22703c;font-family:Fraunces,Georgia,serif}
.dfoot .fsum{margin-right:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:600px){.dfoot{flex-wrap:wrap}.dfoot .fsum{flex:1 1 100%;order:-1;margin:0 0 2px}.dfoot .btn{flex:1}}

/* ===== Calendar (BakeGenie style): today banner, joined grid, filter bar, colour key ===== */
.caltoday{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;color:var(--muted)}
.caltoday b{background:var(--rose-soft);color:var(--rose-ink);border-radius:8px;padding:3px 10px;font-weight:600}
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:0 0 12px}
.calbar select{width:auto;min-width:0}
.cb-l{font-weight:600;color:var(--rose-ink);margin-right:2px}
.cb-s{flex:1 1 220px;margin:0}
.cb-s input{padding-top:8px;padding-bottom:8px}
.cgrid.joined{gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cgrid.joined .dow{background:#fff7fa;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.cgrid.joined .cday{border:0;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;min-height:104px}
.cgrid.joined .cday:nth-child(7n){border-right:0}
.cgrid.joined .cday:nth-last-child(-n+7){border-bottom:0}
.cgrid.joined .cday.out{background:#fdfafb;opacity:1;border-style:solid}
.cgrid.joined .cday.out .n{opacity:.45}
.cgrid.joined .cday:hover{background:#fffafc;box-shadow:none}
.cgrid.joined .cday.sel{box-shadow:inset 0 0 0 2px var(--rose);border-color:var(--line)}
.cday.off{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#fbf1f4 6px,#fbf1f4 12px)!important}
.offmark{margin-top:auto;align-self:flex-start;font-size:10.5px;font-weight:600;color:#9b6d84;background:#f3e6ec;border-radius:5px;padding:0 6px}
.cchip.dim{opacity:.2}
.cday.miss{opacity:.55}
.cday.hit{background:#fff5f9!important}
.calkey{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.calkey>span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.calkey .ck-l{background:none;border:0;padding:0;font-weight:600}
.calkey .dot{width:9px;height:9px}
.ck-off i{width:14px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff,#fff 3px,#e9cfd9 3px,#e9cfd9 6px);border:1px solid #e9cfd9}
.ck-full i{font-style:normal;font-size:10px;font-weight:700;color:#a3324f;background:#fdeaee;border-radius:5px;padding:0 5px}
@media (max-width:600px){.cgrid.joined .cday{min-height:58px}.calbar select{flex:1 1 30%}.cb-l{flex:1 1 100%}.caltoday{flex-wrap:wrap}}

/* ===== Email templates (BakeGenie style) ===== */
.tplgen{padding:0;margin:14px 0 8px}
.tplgen>summary,.tplcard{display:flex;align-items:center;gap:14px;padding:16px 18px;list-style:none;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.tplgen>summary::-webkit-details-marker{display:none}
.tplgen[open]>summary .chev{transform:rotate(90deg)}
.tplgen-b{padding:0 16px 12px;border-top:1px dashed var(--line)}
.tplh{display:flex;align-items:center;gap:10px;margin:24px 0 2px;font-size:21px}
.tplh .hic{width:32px;height:32px;border-radius:10px}.tplh .hic svg{width:19px;height:19px}
.tpllist{display:grid;gap:10px;margin-top:10px}
.tplcard{background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tplcard:hover{border-color:#e6b4c4;box-shadow:0 4px 16px #4b103d12;transform:translateY(-1px)}
.tic{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center}
.tic svg{width:24px;height:24px}
.tplcard .bd,.tplgen .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tplcard .t,.tplgen .t{font-weight:600;font-size:16px}
.tplcard .d,.tplgen .d{color:var(--muted);font-size:13.5px;line-height:1.4;text-transform:none}
.tpill{flex-shrink:0;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;text-transform:none}
.tpill.on{background:#e3f5e8;color:#22703c}
.tpill.off{background:#fff;color:var(--muted);border:1px solid var(--line)}
@media (max-width:600px){.tplcard,.tplgen>summary{padding:14px 12px;gap:10px}.tic{width:38px;height:38px}}

/* ===== Customers list ===== */
.custlist{display:grid;gap:10px;margin-top:12px}
.custcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.custcard:hover{border-color:#e6b4c4;box-shadow:0 4px 16px #4b103d12;transform:translateY(-1px)}
.cav{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;letter-spacing:.02em}
.custcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.custcard .t{font-weight:600;font-size:16px}
.custcard .d{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
.cnext{align-self:flex-start;margin-top:3px;font-size:12px;font-weight:600;color:var(--rose-ink);background:var(--rose-soft);border-radius:999px;padding:2px 9px;text-transform:none}
.cstat{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.cstat b{font-size:15px}
.cstat small{color:var(--muted);font-size:12px}
@media (max-width:600px){.custcard{padding:12px;gap:10px}.cav{width:40px;height:40px;font-size:14px}}

/* ===== Today: quick numbers ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi:hover{border-color:#e6b4c4;box-shadow:0 4px 16px #4b103d12;transform:translateY(-1px)}
.kpi b{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.1;color:var(--ink)}
.kpi span{color:var(--muted);font-size:12.5px;text-transform:none}
.kpi.warn b{color:#b4571c}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:21px}}
</style>

function schedule(o,t){const n=Math.max(1,+o.plan||+S.settings.instalments||1);if(!t.total)return[];const rest=t.total-t.dep;const out=[{label:"Deposit to book",amt:t.dep,when:"When booked"}];if(n<=1||rest<=0)return t.dep>=t.total?out:[...out,{label:"Balance",amt:rest,when:o.date?"By "+new Date(o.date+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"Before the event"}];const each=Math.round(rest/(n-1)*100)/100;for(let i=1;i<n;i++){const amt=i===n-1?Math.round((rest-each*(n-2))*100)/100:each;let when="Before the event";if(o.date){const d=new Date(o.date+"T00:00");const days=Math.round(28*(n-1-i)/(n-1))+(i===n-1?7:0);d.setDate(d.getDate()-days);when="By "+d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}out.push({label:"Payment "+(i+1),amt,when})}return out}
function schedHtml(o,t){const sc=schedule(o,t);if(sc.length<2)return"";let paid=t.paid;return `<div style="margin-top:10px"><span class="lbl">Payment plan</span>${sc.map(x=>{const done=paid>=x.amt-0.005;paid=Math.max(0,paid-x.amt);return `<div class="kv"><span>${done?"✓ ":""}${esc(x.label)} · ${esc(x.when)}</span><span>${money(x.amt)}</span></div>`}).join("")}</div>`}

  const[list,events]=await Promise.all([api("/rest/v1/shop_requests?select=*&order=created_at.desc&limit=200"),api("/rest/v1/shop_event_types?select=id,name,color&order=sort")]);
  RQ.list=list||[];RQ.events=events||[];RQ.state="ready";render();signPics()}
 catch(e){RQ.state=e.code==="signin"?"signin":(e.code==="42501"||/artist access/i.test(e.message))?"noaccess":"error";RQ.err=e.message;render()}}

async function shrinkImg(f,max=1280,q=.8){const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}

/* ---------- Calendar file (.ics) ---------- */
function icsText(list){const esc2=v=>String(v||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n");const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
 const ev=list.filter(o=>o.date).map(o=>{const d=o.date.replace(/-/g,"");let when;if(o.time){const[h,m]=o.time.split(":");const end=new Date(o.date+"T"+o.time);end.setMinutes(end.getMinutes()+30);const e2=`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,"0")}${String(end.getDate()).padStart(2,"0")}T${String(end.getHours()).padStart(2,"0")}${String(end.getMinutes()).padStart(2,"0")}00`;when=`DTSTART:${d}T${h}${m}00\r\nDTEND:${e2}`}else{const n=addDays(o.date,1).replace(/-/g,"");when=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${n}`}
  const what={Collected:"Pickup",Delivered:"Delivery",Shipped:"Ship"}[o.handoff];

/* ---------- Servings planner ---------- */
const inchOf=label=>{const m=String(label).match(/(\d+(?:\.\d+)?)\s*(?:"|”|in\b|inch)/i);return m?+m[1]:null};
function servingsFor(inches,shape,style){const sq=/square/i.test(shape||"");const area=sq?inches*inches:Math.PI*(inches/2)**2;const per=+(S.settings.servingBasis[style]||(style==="wedding"?2:3));return Math.floor(area/per)}
function planTiers(guests,style,shape){const t=ptype(M.item.typeId);const g=t&&t.groups.find(x=>/size/i.test(x.name));if(!g)return[];
 const sizes=g.items.map(l=>({l,in:inchOf(l)})).filter(x=>x.in&&x.in<=16).sort((a,b)=>a.in-b.in);const out=[];
 for(let n=1;n<=5;n++){for(let start=0;start+n<=sizes.length;start++){const stack=sizes.slice(start,start+n);if(n>1&&stack.some((x,i)=>i&&x.in-stack[i-1].in<1.5))continue;const sv=stack.reduce((a,x)=>a+servingsFor(x.in,shape,style),0);if(sv>=guests)out.push({stack:stack.slice().reverse(),sv,n,extra:sv-guests})}}
 out.sort((a,b)=>a.extra-b.extra||a.n-b.n);const seen=new Set(),pick=[];for(const o of out){const k=o.n;if(pick.length<3&&!seen.has(k+":"+o.stack[0].in)){seen.add(k+":"+o.stack[0].in);pick.push(o)}}
 return pick.sort((a,b)=>a.n-b.n)}

  document.querySelectorAll("img[data-sb]").forEach(img=>{const h=PIC.signed[img.dataset.sb];if(h)img.src=h.url})}catch{setTimeout(()=>paths.forEach(p=>PIC.pending.delete(p)),30000)}}

async function uploadPending(){if(!CLOUD.shopId)return;for(const o of [...S.orders,draft]){if(!o||!o.images)continue;for(let i=0;i<o.images.length;i++){const x=o.images[i];if(!String(x).startsWith("data:"))continue;

 portfolio_on:!!P.on,portfolio_intro:P.intro||"",portfolio:(P.items||[]).filter(x=>String(x.src).startsWith("sb:")).map(x=>({path:x.src.slice(3),title:x.title||"",note:x.note||"",event:x.event||"",servings:x.servings||null}))}}

 try{const r=await api("/rest/v1/rpc/shop_save_snapshot",{method:"POST",body:{p_data:forCloud(),p_revision:CLOUD.rev}});
  CLOUD.rev=r.revision;CLOUD.dirty=false;CLOUD.state="on";CLOUD.last=new Date();writeMeta({rev:CLOUD.rev,dirty:false,at:CLOUD.last.toISOString()})}

function repSpan(){const t=new Date(),y=t.getFullYear(),m=t.getMonth(),d=(Y,M,D)=>isoD(new Date(Y,M,D));
 return {month:[d(y,m,1),d(y,m+1,0)],lastmonth:[d(y,m-1,1),d(y,m,0)],quarter:[d(y,m-2,1),d(y,m+1,0)],year:[`${y}-01-01`,`${y}-12-31`],lastyear:[`${y-1}-01-01`,`${y-1}-12-31`],all:["0000-01-01","9999-12-31"]}[repRange]}
function reportData(){const [a,b]=repSpan(),inR=d=>d&&d>=a&&d<=b;
 const orders=S.orders.filter(o=>o.kind==="Order"&&o.status!=="Cancelled"&&inR(o.date));
 const quotes=S.orders.filter(o=>inR(o.issued||o.date)&&(o.kind==="Quote"||(o.log||[]).some(l=>/quote/i.test(l.text||""))));

 const cancelled=S.orders.filter(o=>o.status==="Cancelled"&&inR(o.date)).length;
 let sales=0,tax=0,fees=0,cost=0,paid=0,owed=0;const byType={},byEvent={},byCust={},byMonth={};
 orders.forEach(o=>{const t=totals(o);sales+=t.sub;tax+=t.tax;fees+=t.fee;paid+=Math.min(t.paid,t.total);owed+=Math.max(0,t.bal);
  o.items.forEach(it=>{if(it.discount){byType["Discounts"]=(byType["Discounts"]||0);return}const k=it.typeName||ptype(it.typeId)?.name||"Other";byType[k]=(byType[k]||0)+itemSub(it);cost+=(+it.cost||0)*(+it.qty||1)});
  {const dsc=o.items.filter(x=>x.discount).reduce((a,x)=>a+itemSub(x),0);if(dsc){byType["Discounts"]=(byType["Discounts"]||0)+dsc}else if(byType["Discounts"]===0)delete byType["Discounts"]}
  const ev=evt(o.eventId)?.name||"Other";byEvent[ev]=(byEvent[ev]||0)+t.sub;

function parseCsv(t){const rows=[];let row=[],cell="",q=false;t=t.replace(/^﻿/,"");for(let i=0;i<t.length;i++){const c=t[i];

  else if(c==='"')q=true;else if(c===","||c===";"&&!t.includes(",")){row.push(cell);cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
 if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
async function importCustomers(f){if(f.size>2e6){toast("That file is too big");return}const rows=parseCsv(await f.text());if(rows.length<2){toast("No customers found in that file");return}
 const h=rows[0].map(x=>x.trim().toLowerCase());const col=(...names)=>h.findIndex(x=>names.some(n=>x===n||x.includes(n)));
 const ci={name:col("name","full name","customer"),first:col("first"),last:col("last"),email:col("email","e-mail"),phone:col("phone","mobile","cell"),address:col("address","street"),notes:col("note")};
 if(ci.name<0&&ci.first<0&&ci.email<0){toast("Couldn't find a Name or Email column");return}
 const clean=v=>String(v||"").replace(/^'(?=[=+\-@])/,"").trim();let add=0,skip=0;
 for(const r of rows.slice(1,2001)){const g=k=>ci[k]>=0?clean(r[ci[k]]):"";let name=ci.name>=0&&ci.name!==ci.first?g("name"):"";if(!name)name=[g("first"),g("last")].filter(Boolean).join(" ");let email=g("email").toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))email="";if(!name)name=email.split("@")[0];if(!name){skip++;continue}
  if(S.customers.some(c=>(email&&(c.email||"").toLowerCase()===email)||c.name.toLowerCase()===name.toLowerCase())){skip++;continue}
  S.customers.push({id:uid(),name:name.slice(0,120),email:email.slice(0,254),phone:g("phone").slice(0,40),address:g("address").slice(0,300),notes:g("notes").slice(0,2000)});add++}
 save();render();toast(`Imported ${add} customer${add===1?"":"s"}${skip?` · ${skip} skipped (already here or no name)`:""}`)}

function dragList(sel,onDrop){const list=document.querySelector(sel);if(!list)return;
 const rows=()=>[...list.children].filter(x=>x.dataset&&x.dataset.di!=null);
 list.querySelectorAll(":scope>[data-di]>.grip").forEach(g=>{
  g.addEventListener("keydown",e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();const i=+g.parentElement.dataset.di,j=i+(e.key==="ArrowUp"?-1:1);if(j<0||j>=rows().length)return;onDrop(i,j);requestAnimationFrame(()=>{const n=document.querySelector(`${sel}>[data-di="${j}"]>.grip`);n&&n.focus()})});
  g.addEventListener("pointerdown",e=>{if(e.button)return;e.preventDefault();const it=g.parentElement,items=rows(),from=items.indexOf(it);if(from<0)return;
   const rects=items.map(x=>x.getBoundingClientRect()),gap=rects.length>1?Math.max(0,rects[1].top-rects[0].bottom):0,h=rects[from].height+gap,y0=e.clientY;let to=from;
   try{g.setPointerCapture(e.pointerId)}catch(_){}it.classList.add("dragging");list.classList.add("sorting");
   const mv=ev=>{const dy=ev.clientY-y0;it.style.transform=`translateY(${dy}px)`;const cy=rects[from].top+rects[from].height/2+dy;to=from;rects.forEach((r,k)=>{const mid=r.top+r.height/2;if(k<from&&cy<mid)to=Math.min(to,k);if(k>from&&cy>mid)to=Math.max(to,k)});
    items.forEach((x,k)=>{if(x===it)return;let sh=0;if(from<to&&k>from&&k<=to)sh=-h;if(to<from&&k>=to&&k<from)sh=h;x.style.transform=sh?`translateY(${sh}px)`:""})};
   const up=()=>{g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up);items.forEach(x=>{x.style.transform="";x.classList.remove("dragging")});list.classList.remove("sorting");if(to!==from)onDrop(from,to)};
   g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up)})})}

 if(el.dataset.ps){const[i,k]=el.dataset.ps.split(":");S.prepSteps[+i][k]=k==="days"?Math.max(0,+el.value||0):el.value;save();return}
 if(el.dataset.sb){S.settings.servingBasis[el.dataset.sb]=Math.max(0.5,+el.value||1);save();return}
 if(el.dataset.r){const r=S.recipes.find(x=>x.id===editRec);r[el.dataset.r]=el.value;save();side();return}
 if(el.dataset.rl&&el.tagName==="INPUT"){const[i,k]=el.dataset.rl.split(":");const r=S.recipes.find(x=>x.id===editRec);r.lines[+i][k]=el.value;save();const rc=el.closest(".rline")?.querySelector(".rc");if(rc)rc.textContent=money(lineCost(r.lines[+i]));side();return}
 if(el.dataset.ig&&el.tagName==="INPUT"){const[i,k]=el.dataset.ig.split(":");S.ingredients[+i][k]=el.value;save();return}
 if(el.dataset.cm){C[el.dataset.cm]=el.value;const m=$("cMail");if(m)m.href=`mailto:${encodeURIComponent(C.to)}?subject=${encodeURIComponent(C.subject)}&body=${encodeURIComponent(C.body)}`;return}
 if(el.dataset.doc){S.settings.doc[el.dataset.doc]=el.value;save();return}
 if(el.id==="custSearch"){custSearch=el.value;const pos=el.selectionStart;vCustomers();const s2=$("custSearch");s2.focus();s2.setSelectionRange(pos,pos);return}
 if(el.dataset.m){setM(el);if($("mSum"))$("mSum").innerHTML=sumHtml();if($("mPrev"))$("mPrev").innerHTML=prevHtml();return}
 if(el.id==="o-date"&&$("capNote")){setTimeout(()=>{const n=$("capNote");if(n)n.innerHTML=capNote(draft.date,draft.id)},0)}
 if(el.id==="o-status")return;
 if(el.dataset.o){draft[el.dataset.o]=el.dataset.o==="deposit"&&el.value===""?null:el.value;side();return}
 if(el.dataset.s&&el.type!=="checkbox"){S.settings[el.dataset.s]=el.value;save();side();return}
 if(el.dataset.g!=null&&el.tagName==="INPUT"&&!el.closest("form")){ptype(editType).groups[+el.dataset.g].name=el.value;save();return}
 if(el.dataset.oi){const[gi,ii]=el.dataset.oi.split(":").map(Number);const gr=ptype(editType).groups[gi];const old=gr.items[ii];gr.items[ii]=el.value;if(gr.prices&&old in gr.prices){gr.prices[el.value]=gr.prices[old];delete gr.prices[old]}save();return}
 if(el.dataset.op){const[gi,ii]=el.dataset.op.split(":").map(Number);const gr=ptype(editType).groups[gi];gr.prices=gr.prices||{};const v=gr.items[ii];if(el.value==="")delete gr.prices[v];else gr.prices[v]=+el.value;save();return}
 if(el.dataset.en){S.events[+el.dataset.en].name=el.value;save();side();return}
 if(el.dataset.tx){const[i,k]=el.dataset.tx.split(":");S.taxes[+i][k]=k==="rate"?(+el.value||0):el.value;save();side();return}
 if(el.dataset.tp){const tp=S.tpls.find(x=>x.id===editTpl);tp[el.dataset.tp]=el.value;save();if($("mailPrev"))$("mailPrev").innerHTML=mailHtml(tp);return}
 if(el.id==="search"){search=el.value;const pos=el.selectionStart;vOrders();const s=$("search");s.focus();s.setSelectionRange(pos,pos)}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
 if(f.dataset.a==="addOpt"){ptype(editType).groups[+f.dataset.g].items.push(v);save();render();const nf=document.querySelector(`form[data-g="${f.dataset.g}"] input`);if(nf)nf.focus()}
 if(f.dataset.a==="todoAdd"){S.todos.push({id:uid(),text:v,due:$("todoDue").value||"",done:false});save();render();const n=$("todoText");if(n)n.focus()}
 if(f.dataset.a==="ingAdd"){S.ingredients.push({id:uid(),name:v,packSize:"",unit:"g",packPrice:""});save();render();const nf=document.querySelector('form[data-a="ingAdd"] input');if(nf)nf.focus()}
 if(f.dataset.a==="listAdd"){S.lists[f.dataset.k].push(v);save();render();const nf=document.querySelector(`form[data-k="${f.dataset.k}"] input`);if(nf)nf.focus()}
 if(f.dataset.a==="evAdd"){S.events.push({id:uid(),name:v,color:newEvColor});save();render();$("evName").focus()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modal").classList.contains("on"))closeM()});
const fromHash=()=>{const h=location.hash.slice(1);if(ROUTES.some(r=>r[0]===h&&r[0]!=="sec"&&!r[3]))route=h};
window.addEventListener("popstate",()=>{if(navDepth>0)navDepth--});
window.addEventListener("hashchange",()=>{if($("modal").classList.contains("on"))closeM();fromHash();editType=null;editTpl=null;render()});
/* ---------- From the Studio: a design becomes a quote ---------- */
function takeStudioHandoff(){if(!/[?&]from=studio/.test(location.search))return;let h=null;try{h=JSON.parse(localStorage.getItem("dcs-shop-handoff"))}catch{}try{localStorage.removeItem("dcs-shop-handoff");history.replaceState(null,"",location.pathname+"#new-order")}catch{}
 if(!h||!h.name)return;const cake=S.types.find(t=>/cake/i.test(t.name)&&t.tiers)||S.types[0];
 draft=blankOrder();Object.assign(draft,{kind:"Quote",status:"Inquiry",customer:h.client||"",date:h.date||"",
  notes:[h.allergens?`Allergies: ${h.allergens}`:"",...(h.flavors||[])].filter(Boolean).join("\n"),prodNotes:h.summary||"",
  images:h.img?[h.img]:[],imagesOnDoc:true,studio:{name:h.name,rev:h.rev,code:h.code,servings:h.servings,at:h.at},
  items:[{id:uid(),typeId:cake?.id,typeName:cake?.name||"Cakes",qty:1,price:h.price?String(h.price):"",cost:"",tax:S.settings.defaultTax,notes:`${h.name}${h.servings?` · ${h.servings} servings`:""}`,opts:{}}]});
 const c=h.client&&S.customers.find(x=>x.name.toLowerCase()===h.client.trim().toLowerCase());if(c)Object.assign(draft,{customerId:c.id,phone:c.phone||"",email:c.email||""});
 logEv(draft,`Started from the Studio design “${h.name}” (${h.rev})`);route="new-order";setTimeout(()=>toast(`“${h.name}” is ready to quote. Check the price, then save`),300)}
takeStudioHandoff();
fromHash();render();
cloudHook=()=>schedulePush();
cloudConnect();
window.addEventListener("dcb-auth",()=>{if(CLOUD.state==="off")cloudConnect()});
}
</script>
<script>
(function(){
 var b=document.body,m=document.getElementById("abMenu"),k=document.getElementById("abBack"),sc=document.getElementById("navScrim");
 function open(on){b.classList.toggle("navopen",on);m.setAttribute("aria-expanded",on?"true":"false")}
 m.addEventListener("click",function(){open(!b.classList.contains("navopen"))});
 sc.addEventListener("click",function(){open(false)});
 document.addEventListener("keydown",function(e){if(e.key==="Escape")open(false)});
 document.addEventListener("click",function(e){document.querySelectorAll("details.kebab[open]").forEach(function(d){if(!d.contains(e.target)||e.target.closest(".kmenu [data-a]"))d.open=false})});
 k.addEventListener("click",function(){if(typeof navDepth!=="undefined"&&navDepth>0)history.back();else if(typeof go==="function")go("today")});
})();
</script>
