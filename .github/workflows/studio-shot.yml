name: Studio screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/studio-shot.mjs
      - run: |
          git config user.name "studio-shot bot"; git config user.email "studio-shot@users.noreply.github.com"
          git add assets/home/studio-hero-*.jpg
          git commit -m "Studio screenshots for the home page" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
