name: Cake pictures
# When a theme cake changes in the Studio, re-render its picture for the website.
on:
  push:
    branches: [main]
    paths: [studio.html]
  workflow_dispatch:
    inputs:
      themes:
        description: "Theme keys to re-render, separated by spaces (blank = only changed ones, 'all' = every pictured cake)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Render changed cakes
        run: |
          T="${{ github.event.inputs.themes }}"
          if [ "$T" = "all" ]; then node scripts/render-cakes.mjs --all; else node scripts/render-cakes.mjs $T; fi
      - name: Point the home page at the new pictures
        run: node scripts/sync-home-cakes.mjs index.html
      - name: Save the new pictures
        run: |
          git config user.name "cake-pictures bot"
          git config user.email "cake-pictures@users.noreply.github.com"
          git add assets/home/cakes index.html
          if git diff --cached --quiet; then echo "No picture changes"; exit 0; fi
          git commit -m "Website cake pictures re-rendered from the Studio"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
