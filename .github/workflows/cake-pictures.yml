name: Cake pictures
# When a theme cake changes in the Studio, re-render its picture for the website.
on:
  push:
    branches: [main]
    paths: [studio.html]
  workflow_dispatch:
    inputs:
      themes:
        description: "Theme keys to re-render, separated by spaces (blank = only changed ones, 'all' = every pictured cake)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Render changed cakes
        run: |
          T="${{ github.event.inputs.themes }}"
          if [ "$T" = "all" ]; then node scripts/render-cakes.mjs --all; else node scripts/render-cakes.mjs $T; fi
      - name: Save the new pictures
        run: |
          git config user.name "cake-pictures bot"
          git config user.email "cake-pictures@users.noreply.github.com"
          [ -f .rendered-cakes.json ] || { echo "Nothing rendered"; exit 0; }
          mkdir -p /tmp/new && cp assets/home/cakes/* /tmp/new/ && cp .rendered-cakes.json /tmp/rendered.json
          # Lay the new pictures on top of the latest main (other changes may have landed while rendering), then push.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            node -e '
              const fs=require("fs"),r=JSON.parse(fs.readFileSync("/tmp/rendered.json")),M="assets/home/cakes/manifest.json",m=JSON.parse(fs.readFileSync(M));
              for(const k of Object.keys(r)){for(const n of [k+".jpg",k+".webp",k+"-pair.jpg",k+"-pair.webp"])if(fs.existsSync("/tmp/new/"+n))fs.copyFileSync("/tmp/new/"+n,"assets/home/cakes/"+n);m[k]=r[k]}
              fs.writeFileSync(M,JSON.stringify(Object.fromEntries(Object.entries(m).sort()),null,1)+"\n")'
            node scripts/sync-home-cakes.mjs index.html
            git add assets/home/cakes index.html
            if git diff --cached --quiet; then echo "No picture changes"; exit 0; fi
            git commit -qm "Website cake pictures re-rendered from the Studio"
            git push -q origin HEAD:main && exit 0
            sleep $((i*7))
          done
          exit 1
