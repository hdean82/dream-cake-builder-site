<style>
.tipbox{margin:0 0 10px}.tips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tipb{border:1px solid #e3c6d6;background:#fff;border-radius:12px;padding:7px 12px;font:inherit;font-size:14px;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:64px}.tipb small{font-size:11.5px;color:#79536e}.tipb.on{border-color:#c12c7e;background:#fde3f0;font-weight:600}.tipc{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 6px}.tipc input{width:110px;padding:8px 10px;border:1px solid #e3c6d6;border-radius:10px;font:inherit}.tipsum{margin:4px 0 0;font-size:14px}

.rvq{margin:10px 0 2px;font-size:14px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #eed3e3}.rvq .st{color:#e0a100;letter-spacing:1px}.rvq .q{display:block;color:#79536e;font-size:13px;margin-top:3px}

.q-wrap{max-width:780px;margin:0 auto;padding:6px 14px 30px}
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:0 8px 24px #7a1a5a12}
.dtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:12px}
.dbrand{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;color:var(--acc)}
.dno{text-align:right}.dno b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;text-transform:capitalize}.dno span{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px}
.dmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 3px}
.dmeta .lbl{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 4px}
td{padding:8px 4px;border-bottom:1px solid #f3e6ee;vertical-align:top}
.n{text-align:right;white-space:nowrap}
.dtot{margin:10px 0 0 auto;max-width:300px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.kv.tot{font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.dpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dpics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pre{white-space:pre-wrap;margin:0;font-size:14px}
.dcancel{border:2px solid #b3261e;color:#b3261e;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}.dcancel b{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.dsecs{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.dsec{border:1px solid #efdde6;border-radius:12px;padding:12px 14px;background:#fffdfd;font-size:14px;line-height:1.55}
.dsec h4{margin:0 0 6px;font:700 11.5px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc,#c12c7e)}
.dthanks{text-align:center;background:none;border-style:dashed}
.dfold>summary{cursor:pointer;font:700 11.5px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc,#c12c7e);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.dfold>summary::-webkit-details-marker{display:none}.dfold>summary:after{content:"+";font-size:20px;line-height:1;font-weight:400}.dfold[open]>summary:after{content:"−"}
.dfold .rich{margin-top:8px}.rich ul,.rich ol{margin:4px 0;padding-left:22px}.rich a{color:var(--acc,#c12c7e)}
.docfoot{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}
.answer{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.answer h2{font-size:20px;margin:0 0 4px}
.track{display:flex;list-style:none;margin:12px 0 4px;padding:0;gap:4px}.track li{flex:1;text-align:center;font-size:12.5px;color:var(--muted);position:relative}
.track li span{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;position:relative;z-index:1}
.track li:not(:first-child)::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line)}
.track li.done span{background:var(--acc,#c12c7e);border-color:var(--acc,#c12c7e);color:#fff}.track li.done:not(:first-child)::before{background:var(--acc,#c12c7e)}
.track li.now{color:var(--ink);font-weight:600}.trnote{text-align:center;margin:6px 0 0;font-weight:600}
.calbtn{margin-top:8px}
.sigwrap{margin:6px 0 10px}.sigwrap label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.sigpad{display:block;width:100%;height:130px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;touch-action:none;cursor:crosshair}.sigrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.sigrow button{background:none;border:0;color:var(--rose-ink,#9a1b5f);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}.signed{display:inline-block;margin-top:6px;font-size:13px;color:#0f5f5b}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field input,.field textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.state{border-radius:14px;padding:14px 16px;margin-top:14px;font-size:15px}
.state.ok{background:#e3f4f2;color:#0f5f5b;border:1px solid #bfe3df}
.state.no{background:#fdecea;color:#8c1d16;border:1px solid #f3c7c2}
.msg{color:#8c1d16;font-size:14px;min-height:1em;margin:6px 0 0}
.paybtn{display:inline-flex;align-items:center;gap:6px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.big{font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--ink);margin-bottom:6px}
@media print{.site-head,.site-foot,.answer,.noprint{display:none!important}body{background:#fff!important}.doc{border:0;box-shadow:none}}
.paybox{margin:14px 0 0;padding:14px 16px;border:1.5px solid var(--acc,#c12c7e);border-radius:14px;background:#fff}.payrow{display:flex;gap:8px;flex-wrap:wrap}.payrow .btn{min-height:46px;padding:0 18px}.paydone{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:#e3f5e8;color:#22703c}

.custpage .site-nav,.custpage details.menu{display:none!important}.custpage .site-head .brand{pointer-events:none}

<script>
{
const SB='https://gcorvodfcxhumesttwvj.supabase.co',KEY='sb_publishable_6ruYyVr__8c65Az5WCsiaA_jD9AcOgb';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Artist-written text with simple styling (bold, italic, underline, lists, links). Anything else is removed.
function richClean(html){const d=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
 const walk=n=>{let out='';n.childNodes.forEach(c=>{if(c.nodeType===3){out+=esc(c.textContent);return}if(c.nodeType!==1)return;const t=c.tagName,inner=walk(c);
  if(t==='BR')out+='<br>';else if(t==='A'){const h=c.getAttribute('href')||'';out+=/^(https?:|mailto:|tel:)/i.test(h)?`<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:inner}
  else if(t==='B'||t==='STRONG')out+=`<b>${inner}</b>`;else if(t==='I'||t==='EM')out+=`<i>${inner}</i>`;else if(t==='U')out+=`<u>${inner}</u>`;
  else if(t==='UL'||t==='OL'||t==='LI')out+=`<${t.toLowerCase()}>${inner}</${t.toLowerCase()}>`;else if(t==='DIV'||t==='P')out+=`<div>${inner||'<br>'}</div>`;else out+=inner});return out};
 return walk(d.body.firstChild)}
const richHtml=v=>/<(b|i|u|br|div|p|ul|ol|li|a|strong|em)\b/i.test(v||'')?richClean(v):esc(v||'').replace(/\n/g,'<br>');
addEventListener('beforeprint',()=>document.querySelectorAll('details.dfold').forEach(x=>x.open=true));
const app=$('app');
const token=(new URLSearchParams(location.search).get('t')||'').trim();
let Q=null,urls={};
const rpc=async(fn,body)=>{const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H,body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Something went wrong');return j};
const safeColor=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#c12c7e';
const safeLink=u=>/^https:\/\/[^\s"'<>]+$/.test(u||'')?u:'';

function msg(t,x){app.innerHTML=`<div class="empty"><div class="big">${esc(t)}</div><p>${esc(x)}</p></div>`}
const TRACK={Confirmed:1,Baking:2,Ready:3,Completed:4};
let RVQ=null;function fillRv(){const el=document.getElementById('rvq');if(!el)return;const paint=()=>{const R=(RVQ&&RVQ.reviews||[]).filter(x=>+x.rating>=1);if(!R.length)return;const avg=R.reduce((a,x)=>a+ +x.rating,0)/R.length,top=R.find(x=>+x.rating>=4&&x.body);
 el.innerHTML=`<span class="st" aria-hidden="true">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> <b>${avg.toFixed(1)}</b> from ${R.length} review${R.length===1?'':'s'}${top?`<span class="q">“${esc(String(top.body).length>110?String(top.body).slice(0,107).trim()+'…':top.body)}” ${esc(top.name||'')}</span>`:''}`;el.hidden=false};
 if(RVQ)return paint();rpc('shop_reviews_public',{p_slug:Q.doc.slug}).then(j=>{RVQ=j||{reviews:[]};paint()}).catch(()=>{})}
function draw(){const d=Q.doc,st=Q.status,isQ=d.kind==='quote';
 document.title=`${d.title||'Quote'} #${d.no} · ${d.biz}`;
 const when=Q.responded_at?new Date(Q.responded_at).toLocaleDateString(undefined,{month:'long',day:'numeric'}):'';
 app.innerHTML=`
 <div class="doc" style="--acc:${safeColor(d.accent)}">
  <div class="dtop"><div>${/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(d.logo||"")?`<img src="${d.logo}" alt="" style="height:52px;max-width:180px;object-fit:contain;display:block;margin-bottom:6px">`:""}<div class="dbrand">${esc(d.biz)}</div><div class="note">${esc(d.contact)}</div></div><div class="dno"><b>${esc(d.title)}</b><span>#${esc(d.no)}</span></div></div>
  ${!d.cancelled&&TRACK[d.stage]?(()=>{const k=TRACK[d.stage],del=/deliver/i.test(d.handoff||''),L=['Booked','Baking','Ready',del?'Delivered':'Picked up'];return `<ol class="track" aria-label="Order progress">${L.map((l,i)=>`<li class="${i<k?'done':''}${i===k-1?' now':''}"><span>${i<k?'✓':i+1}</span>${l}</li>`).join('')}</ol>${k===3?`<p class="trnote">🎂 Your cake is ready${del?' and on its way soon':' for pickup'}!</p>`:''}`})():''}
  ${d.cancelled?`<div class="dcancel"><b>Cancelled</b>${d.cancelled.note?`<div class="pre" style="color:var(--ink)">${esc(d.cancelled.note)}</div>`:''}</div>`:''}
  <div class="dmeta"><div><span class="lbl">For</span><b>${esc(d.customer)}</b></div>
   <div><span class="lbl">Event</span><b>${esc(d.date||'Date to be set')}${d.time?' · '+esc(d.time):''}</b><div class="note">${esc([d.event,d.handoff+(d.address?': '+d.address:'')].filter(Boolean).join(' · '))}</div>${d.dlv&&(d.dlv.place||d.dlv.contact)?`<div class="note">${esc([d.dlv.place,d.dlv.contact?'Day-of contact: '+d.dlv.contact:''].filter(Boolean).join(' · '))}</div>`:''}</div>
   <div><span class="lbl">${esc(d.validLabel)}</span><b>${esc(d.validDate)}</b></div></div>
  <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody>
   ${(d.items||[]).map(it=>`<tr><td><b>${esc(it.title)}</b>${(it.lines||[]).map(l=>`<div class="note">${esc(l)}</div>`).join('')}</td><td class="n">${esc(it.qty)}</td><td class="n">${esc(it.price)}</td><td class="n">${esc(it.total)}</td></tr>`).join('')}
  </tbody></table>
  <div class="dtot"><div class="kv"><span>Subtotal</span><span>${esc(d.sub)}</span></div>${d.tax?`<div class="kv"><span>Tax</span><span>${esc(d.tax)}</span></div>`:''}${d.fee?`<div class="kv"><span>Delivery</span><span>${esc(d.fee)}</span></div>`:''}
   <div class="kv tot"><span>Total</span><span>${esc(d.total)}</span></div>${d.paid?`<div class="kv"><span>Paid</span><span>${esc(d.paid)}</span></div>`:''}
   <div class="kv"><span>${esc(d.depLabel)}</span><span>${esc(d.dep)}</span></div><div class="kv" id="paidRow" hidden><span>Paid online</span><span id="paidAmt"></span></div><div class="kv tot"><span>Balance due</span><span id="balAmt">${esc(d.bal)}</span></div></div>
  <div id="payBox" class="noprint"></div>
  ${(d.images||[]).length?`<span class="lbl">Your cake</span><div class="dpics">${d.images.map(p=>urls[p]?`<img src="${esc(urls[p])}" alt="Cake design" loading="lazy">`:'').join('')}</div>`:''}
  ${d.notes?`<span class="lbl">Additional Notes</span><p class="pre">${esc(d.notes)}</p>`:''}
  ${(()=>{const sec=[],pay=safeLink(d.payLink)&&!d.cancelled?`<p class="noprint" style="margin:8px 0 0"><a class="btn primary paybtn" href="${esc(safeLink(d.payLink))}" target="_blank" rel="noopener noreferrer">Pay Online</a></p>`:'';
   if(d.payNote||pay)sec.push(`<section class="dsec" id="howPay"><h4>How to pay</h4>${d.payNote?`<div class="rich">${richHtml(d.payNote)}</div>`:''}${pay}</section>`);
   if(d.footer)sec.push(`<section class="dsec dthanks"><div class="rich">${richHtml(d.footer)}</div></section>`);
   (Array.isArray(d.policies)?d.policies:d.cancelPolicy?[{t:'Cancellation policy',h:d.cancelPolicy}]:[]).forEach(p=>{if(p&&p.h)sec.push(`<details class="dsec dfold"><summary>${esc(p.t||'Policy')}</summary><div class="rich">${richHtml(p.h)}</div></details>`)});
   if(d.terms)sec.push(`<details class="dsec dfold"><summary>Full terms &amp; conditions</summary><div class="rich">${richHtml(d.terms)}</div></details>`);
   return sec.length?`<div class="dsecs">${sec.join('')}</div>`:''})()}
 </div>
 ${d.cancelled?'':st==='approved'?`<div class="state ok"><b>You approved this ${isQ?'quote':'invoice'}${Q.responder_name?' as '+esc(Q.responder_name):''}${when?' on '+esc(when):''}.</b>${Q.signed?' <span class="signed">✍️ Signed online.</span>':''} ${esc(d.biz)} will see your answer in their orders.<span class="depnote">${d.dep&&isQ?` Your deposit of <b>${esc(d.dep)}</b> books your date.`:''}</span><br><span class="payjump" hidden><button type="button" class="btn sm primary" data-payjump="1">Pay your deposit now</button> </span>${d.iso?`<button type="button" class="btn sm calbtn" data-ics="1">📅 Add to my calendar</button>`:''}</div>${answerBox(true)}`
  :st==='declined'?`<div class="state no"><b>You declined this ${isQ?'quote':'invoice'}${when?' on '+esc(when):''}.</b> Changed your mind? Send ${esc(d.biz)} a message below.</div>${answerBox(true)}`
  :Q.expired?`<div class="state no"><b>This quote has expired.</b> Send ${esc(d.biz)} a message below to ask for a new one.</div>${answerBox(true)}`
  :answerBox(false)}
 <p class="noprint" style="text-align:center;margin:12px 0 0"><button class="btn sm" type="button" onclick="print()">Print Or Save As PDF</button></p>`;
 fillRv()
}
function answerBox(msgOnly){const isQ=Q.doc.kind==='quote';
 return `<form class="answer noprint" id="ans" novalidate><h2>${msgOnly?'Send A Message':isQ?'Ready To Book?':'Questions?'}</h2>
  <p class="note" style="margin:0">${msgOnly?`Your message goes straight to ${esc(Q.doc.biz)}.`:isQ?`Approve to let ${esc(Q.doc.biz)} know you'd like to go ahead, or send a question first.`:`Let ${esc(Q.doc.biz)} know if anything needs changing.`}</p>${isQ&&!msgOnly&&/^[a-z0-9-]{2,60}$/.test(Q.doc.slug||'')?'<div id="rvq" class="rvq" hidden></div>':''}
  <div class="field"><label for="a-name">Your name</label><input id="a-name" autocomplete="name" maxlength="120" value="${esc(Q.responder_name||Q.doc.customer||'')}"></div>
  <div class="field"><label for="a-msg">Message <span class="note">optional</span></label><textarea id="a-msg" maxlength="2000" placeholder="Anything you'd like to add or change"></textarea></div>
  ${!msgOnly&&isQ?`<div class="sigwrap"><label for="sigPad">Sign to approve</label><canvas class="sigpad" id="sigPad" aria-label="Signature pad. Draw your signature with your finger or mouse."></canvas><div class="sigrow"><span class="note">Use your finger or mouse</span><button type="button" id="sigClear">Clear</button></div></div>`:''}
  ${!msgOnly&&isQ&&Q.doc.terms?`<label class="note" style="display:flex;gap:8px;align-items:flex-start;margin:4px 0 8px"><input type="checkbox" id="a-terms" style="margin-top:3px"> I've read the terms and policies above.</label>`:''}
  <div class="acts">${msgOnly?`<button class="btn primary" type="button" data-act="message">Send Message</button>`:`${isQ?`<button class="btn primary" type="button" data-act="approve">Approve Quote</button>`:''}<button class="btn" type="button" data-act="message">Send A Question</button>${isQ?`<button class="btn" type="button" data-act="decline">Decline</button>`:''}`}</div>
  <p class="msg" id="a-out" role="status"></p></form>`}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,out=$('a-out');
 const name=$('a-name').value.trim(),m=$('a-msg').value.trim();out.textContent='';
 if(!name){out.textContent='Please type your name.';$('a-name').focus();return}
 if(act==='message'&&!m){out.textContent='Please write your message.';$('a-msg').focus();return}
 if(act==='approve'&&$('a-terms')&&!$('a-terms').checked){out.textContent='Please tick the box to confirm you read the terms.';return}
 if(act==='approve'&&$('sigPad')&&!SIG.has){out.textContent='Please sign in the box to approve.';$('sigPad').scrollIntoView({block:'center',behavior:'smooth'});return}
 if(act==='decline'&&!confirm('Decline this quote?'))return;
 document.querySelectorAll('[data-act]').forEach(x=>x.disabled=true);b.textContent='Sending…';
 try{const st=await rpc('shop_quote_respond',{p_token:token,p_action:act,p_name:name,p_message:m||null});
  fetch(`${SB}/functions/v1/shop-notify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'quote',token}),keepalive:true}).catch(()=>{});
  if(act==='approve'&&SIG.has){try{await rpc('shop_quote_sign',{p_token:token,p_signature:sigData()});Q.signed=true}catch(e){console.warn('signature',e)}}
  Q.status=st;Q.responder_name=name;Q.responded_at=new Date().toISOString();draw();payDraw();
  if(act==='message'){const o=$('a-out');if(o){o.style.color='#0f5f5b';o.textContent='Message sent. Thank you!'}}
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})
 }catch(err){document.querySelectorAll('[data-act]').forEach(x=>x.disabled=false);b.textContent={approve:'Approve Quote',decline:'Decline',message:'Send Message'}[act];out.textContent=err.message||'Something went wrong. Please try again.'}});


// Add the pickup or delivery to the client's own calendar (an .ics file every calendar app opens).
document.addEventListener('click',e=>{if(!e.target.closest('[data-ics]'))return;const d=Q.doc;if(!d.iso)return;const p=x=>String(x).padStart(2,'0');
 const ic=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n'),dt=d.iso.replace(/-/g,'');let start,end;
 if(d.t24){const[h,m]=d.t24.split(':').map(Number);start=`DTSTART:${dt}T${p(h)}${p(m)}00`;const e2=new Date(2000,0,1,h,m+30);end=`DTEND:${dt}T${p(e2.getHours())}${p(e2.getMinutes())}00`}
 else{const n=new Date(d.iso+'T12:00');n.setDate(n.getDate()+1);start=`DTSTART;VALUE=DATE:${dt}`;end=`DTEND;VALUE=DATE:${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}`}
 const what=d.handoff==='Delivered'||d.handoff==='Delivery'?'Cake delivery':'Cake pickup';
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dream Cake Builder//Quote//EN','BEGIN:VEVENT',`UID:${token}@dreamcakebuilder.com`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,start,end,
  `SUMMARY:${ic(what+' · '+d.biz)}`,`DESCRIPTION:${ic((d.no?'Order #'+d.no+'. ':'')+'Your quote: '+location.href)}`,d.address&&!/shared once/i.test(d.address)?`LOCATION:${ic(d.address)}`:'','BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY',`DESCRIPTION:${ic(what)}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='cake-'+(d.no||'order')+'.ics';document.body.appendChild(a);a.click();a.remove()});

// Signature pad: drawn with a finger or mouse, saved as a small PNG when the quote is approved.
const SIG={has:false,ctx:null};
function sigInit(){const c=$('sigPad');if(!c||c.dataset.on)return;c.dataset.on=1;const r=c.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
 const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2b1424';SIG.ctx=x;SIG.has=false;let d=false,lx=0,ly=0;
 const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.addEventListener('pointerdown',e=>{d=true;c.setPointerCapture(e.pointerId);[lx,ly]=pt(e);x.beginPath();x.arc(lx,ly,1.1,0,7);x.fill();SIG.has=true});
 c.addEventListener('pointermove',e=>{if(!d)return;const[a,b]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(a,b);x.stroke();lx=a;ly=b});
 const up=()=>d=false;c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
 $('sigClear').onclick=()=>{x.clearRect(0,0,c.width,c.height);SIG.has=false}}
function sigData(){const c=$('sigPad'),o=document.createElement('canvas');const w=Math.min(600,c.width),h=Math.round(c.height*w/c.width);o.width=w;o.height=h;o.getContext('2d').drawImage(c,0,0,w,h);return o.toDataURL('image/png')}
new MutationObserver(()=>sigInit()).observe(document.body,{childList:true,subtree:true});

// Pay by card straight to the cake artist (Stripe), when they've switched it on.
let PAY=null,PAID=null;
const fm=c=>'$'+(c/100).toFixed(2);
async function payCall(body){const r=await fetch(`${SB}/functions/v1/shop-pay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Payments are unavailable right now.');return j}
let TIP={pct:0,custom:''},TIPPED=0;
function tipCents(){if(!PAY||!PAY.tips||PAY.deposit)return 0;if(TIP.pct==='c'){const v=Math.round(parseFloat(String(TIP.custom).replace(/[^0-9.]/g,''))*100)||0;return Math.max(0,Math.min(v,PAY.balance,100000))}return Math.round(PAY.balance*(+TIP.pct||0)/100)}
function tipHtml(){const o=[[0,'No tip'],[10,'10%'],[15,'15%'],[20,'20%'],['c','Custom']];const t=tipCents();
 return `<div class="tipbox"><b>Add a tip?</b> <span class="note">Optional, and it all goes to ${esc(Q.doc.biz)}.</span><div class="tips" role="radiogroup" aria-label="Tip">${o.map(([v,l])=>`<button type="button" class="tipb${String(TIP.pct)===String(v)?' on':''}" role="radio" aria-checked="${String(TIP.pct)===String(v)}" data-tip="${v}">${l}${typeof v==='number'&&v?`<small>${esc(fm(Math.round(PAY.balance*v/100)))}</small>`:''}</button>`).join('')}</div>
 ${TIP.pct==='c'?`<label class="tipc">Tip amount <input id="tipAmt" inputmode="decimal" placeholder="$0.00" value="${esc(TIP.custom)}"></label>`:''}
 <p class="tipsum" id="tipSum">Balance ${esc(fm(PAY.balance))}${t?` + tip ${esc(fm(t))} = <b>${esc(fm(PAY.balance+t))}</b>`:''}</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tip]');if(!b)return;TIP.pct=b.dataset.tip==='c'?'c':+b.dataset.tip;payDraw();if(TIP.pct==='c'&&$('tipAmt'))$('tipAmt').focus()});
document.addEventListener('input',e=>{if(e.target.id!=='tipAmt')return;TIP.custom=e.target.value;const t=tipCents();$('tipSum').innerHTML=`Balance ${esc(fm(PAY.balance))}${t?` + tip ${esc(fm(t))} = <b>${esc(fm(PAY.balance+t))}</b>`:''}`;if($('payBal'))$('payBal').textContent=`Pay balance ${fm(PAY.balance+t)}`});
function payDraw(){const box=$('payBox');if(!box)return;const d=Q.doc;let h='';
 const online=Math.max(PAID||0,(PAY&&PAY.paid)||0),cents=v=>Math.round(parseFloat(String(v||'').replace(/[^0-9.]/g,''))*100)||0;
 if(online>0&&$('paidRow')){$('paidRow').hidden=false;$('paidAmt').textContent='−'+fm(online);const left=Math.max(0,cents(d.bal)-online);$('balAmt').textContent=fm(left);if(!left){if($('howPay'))$('howPay').hidden=true;document.querySelectorAll('.depnote').forEach(x=>x.textContent=' Your date is booked.')}
  if(!PAID)h+=`<div class="paydone"><b>${left?'Payment received.':'Paid in full, thank you!'}</b> ${esc(fm(online))} paid online to ${esc(d.biz)}.</div>`}
 if(PAID)h+=`<div class="paydone"><b>Payment received, thank you!</b> ${esc(fm(PAID))}${TIPPED?` plus your ${esc(fm(TIPPED))} tip`:''} went to ${esc(d.biz)}. Keep this page for your records.</div>`;
 if(PAY&&PAY.enabled&&!d.cancelled){const isQ=d.kind==='quote',needApprove=isQ&&Q.status!=='approved';
  h+=`<div class="paybox"><b>Pay Online</b><p class="note" style="margin:2px 0 10px">Secure card payment. It goes straight to ${esc(d.biz)}.</p>${needApprove?`<p class="note" style="margin:0 0 8px">Paying approves this quote and books your date.</p>`:''}
  ${PAY.tips&&!PAY.deposit&&PAY.balance?tipHtml():''}<div class="payrow">${PAY.deposit?`<button class="btn primary" type="button" data-pay="deposit">Pay deposit ${esc(fm(PAY.deposit))}</button>`:''}${PAY.balance?`<button class="btn${PAY.deposit?'':' primary'}" type="button" data-pay="balance" id="payBal">Pay ${PAY.deposit?'in full':'balance'} ${esc(fm(PAY.balance+(PAY.deposit?0:tipCents())))}</button>`:''}</div><p class="note" id="payMsg" role="status" style="margin:8px 0 0"></p></div>`}
 box.innerHTML=h;document.querySelectorAll('.payjump').forEach(x=>{x.hidden=!(PAY&&PAY.enabled&&(PAY.deposit||PAY.balance)&&!d.cancelled);const bt=x.querySelector('button');if(bt)bt.textContent=PAY&&PAY.deposit?'Pay your deposit now':'Pay now'})}
document.addEventListener('click',e=>{if(e.target.closest('[data-payjump]')){const pb=$('payBox');if(pb)pb.scrollIntoView({behavior:'smooth',block:'center'})}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-pay]');if(!b)return;const m=$('payMsg');document.querySelectorAll('[data-pay]').forEach(x=>x.disabled=true);b.textContent='Opening secure checkout…';
 try{const tip=b.dataset.pay==='balance'?tipCents():0;const j=await payCall({action:'checkout',token,what:b.dataset.pay,...(tip?{tip}:{})});if(!/^https:\/\/checkout\.stripe\.com\//.test(j.url||''))throw new Error('Payments are unavailable right now.');location.href=j.url}
 catch(err){if(m)m.textContent=err.message;payDraw()}});
async function payInit(){try{const u=new URLSearchParams(location.search),sid=u.get('paid')||'';
  if(/^cs_(test|live)_[A-Za-z0-9]+$/.test(sid)){const j=await payCall({action:'confirm',token,session:sid}).catch(()=>null);if(j&&j.ok){PAID=j.amount-(j.tip||0);TIPPED=j.tip||0;if(Q&&Q.status==='sent'){Q.status='approved';Q.responded_at=new Date().toISOString();draw()}}try{history.replaceState(null,'',location.pathname+'?t='+token)}catch{}}
  PAY=await payCall({action:'options',token}).catch(()=>null);payDraw()}catch{}}
(async()=>{
 if(!/^[0-9a-f-]{36}$/i.test(token))return msg('Link not found','Please check the link you were sent.');
 try{Q=await rpc('shop_quote_view',{p_token:token});
  if(!Q)return msg('This link is no longer active','Please contact your cake artist for a new link.');
  draw();payInit();
  const paths=(Q.doc.images||[]).slice(0,8);
  if(paths.length){const r=await fetch(`${SB}/storage/v1/object/sign/shop-files`,{method:'POST',headers:H,body:JSON.stringify({expiresIn:86400,paths})});
   if(r.ok){(await r.json()).forEach(x=>{if(x.signedURL&&x.path)urls[x.path]=SB+'/storage/v1'+x.signedURL});const keep=[$('a-name')&&$('a-name').value,$('a-msg')&&$('a-msg').value];draw();payDraw();if(keep[0]!=null&&$('a-name')){$('a-name').value=keep[0];$('a-msg').value=keep[1]}}}
 }catch{msg('We couldn’t load this page','Please check your connection and try again.')}
})();
}
