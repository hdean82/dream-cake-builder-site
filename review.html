<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review · Dream Cake Builder</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Leave a review">
<meta property="og:description" content="How was your cake? Share a few words.">
<meta property="og:image" content="https://www.dreamcakebuilder.com/assets/home/lambeth-hero.jpg">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#c12c7e">
<link rel="icon" href="lilac/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dcb-theme.css">
<style>
.rv-wrap{max-width:560px;margin:0 auto;padding:8px 16px 40px}
.rv-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.rv-card h1{font-size:clamp(24px,5vw,32px);margin:4px 0 4px}
.rv-card .lead{color:var(--muted);margin:0 0 16px}
.stars{display:flex;gap:6px;margin:4px 0 14px}
.stars button{font-size:38px;line-height:1;background:none;border:0;padding:2px;cursor:pointer;color:#e7cbd8;transition:transform .12s}
.stars button.on{color:#f2a900}.stars button:hover{transform:scale(1.12)}
.stars button:focus-visible{outline:2px solid var(--rose);border-radius:8px}
.field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}.field input:focus,.field textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
.msg{min-height:20px;color:var(--rose-ink,#9a1b5f);font-size:14px;margin:8px 0 0}
.done{text-align:center;padding:20px 0}.done .big{font-family:Fraunces,Georgia,serif;font-size:28px;margin-bottom:6px}
</style>
</head>
<body>
<header class="site-head">
 <div class="head-in">
  <a class="brand" href="index.html" aria-label="Dream Cake Builder home"><img src="lilac/assets/favicon.svg" alt="" data-fallback width="34" height="34"><span class="bt"><span class="bn">Dream <span>Cake</span> Builder</span><small class="tag">See it before you bake it.</small></span></a>
  <nav class="site-nav" aria-label="Main">
   <a href="index.html">Home</a>
   <a href="index.html#how-it-works">How It Works</a>
   <a href="studio.html">Studio</a>
   <a href="shop.html#orders" data-team>Orders</a>
   <a href="shop.html#calendar" data-team>Calendar</a>
   <a href="contact.html">Contact</a>
   <a href="account.html" data-acct>Sign In</a>
   <a class="btn primary sm cta" href="index.html#launch-list">Join Waitlist</a>
  </nav>
  <details class="menu">
   <summary aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></summary>
   <div class="menu-panel"><a href="index.html">Home</a><a href="index.html#how-it-works">How It Works</a><a href="studio.html">Studio</a><a href="shop.html#orders" data-team>Orders</a><a href="shop.html#calendar" data-team>Calendar</a><a href="contact.html">Contact</a><a href="account.html" data-acct>Sign In</a><a href="index.html#launch-list">Join Waitlist</a></div>
  </details>
 </div>
</header>
<main class="band"><div class="rv-wrap"><div class="rv-card" id="app"><p class="muted">Loading…</p></div></div></main>
<footer class="site-foot"><div class="foot-in"><span>Reviews powered by <a href="index.html">Dream Cake Builder</a>.</span><a href="privacy.html">Privacy</a><span class="end">© <span data-year>2026</span></span></div></footer>
<script src="assets/dcb-site.js" defer></script>
<script>
{
const SB='https://gcorvodfcxhumesttwvj.supabase.co',KEY='sb_publishable_6ruYyVr__8c65Az5WCsiaA_jD9AcOgb';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id),app=$('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search),slug=(q.get('shop')||'').trim().toLowerCase(),cake=(q.get('cake')||'').slice(0,80),who=(q.get('name')||'').slice(0,60);
let biz='',rating=0;
const rpc=async(fn,body)=>{const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H,body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Something went wrong. Please try again.');return j};
function draw(){app.innerHTML=`<span class="eyebrow">Leave a review</span><h1>How was your cake${biz?` from ${esc(biz)}`:''}?</h1><p class="lead">A few words help other people find a great cake artist. Thank you!</p>
 <form id="f" novalidate><div class="field"><span style="font-weight:600;font-size:14px" id="rl">Your rating</span><div class="stars" role="radiogroup" aria-labelledby="rl">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${rating===n}" aria-label="${n} star${n>1?'s':''}" data-s="${n}" class="${n<=rating?'on':''}">★</button>`).join('')}</div></div>
 <div class="field"><label for="b">Your review</label><textarea id="b" rows="5" maxlength="1500" placeholder="What did everyone think? How did it taste and look?"></textarea></div>
 <div class="field"><label for="n">Your name</label><input id="n" maxlength="60" autocomplete="name" value="${esc(who)}"><span class="muted" style="font-size:12.5px">Only your first name and last initial are shown.</span></div>
 ${cake?`<p class="muted" style="font-size:13.5px;margin:0 0 10px">About: <b>${esc(cake)}</b></p>`:''}
 <button class="btn primary" type="submit" style="width:100%">Send my review</button><p class="msg" id="m" role="status"></p></form>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const keep=$('b').value,n=$('n').value;rating=+b.dataset.s;draw();$('b').value=keep;$('n').value=n;document.querySelector(`[data-s="${rating}"]`).focus()});
document.addEventListener('submit',async e=>{e.preventDefault();const m=$('m'),name=$('n').value.trim(),body=$('b').value.trim();
 if(!rating){m.textContent='Please tap a star rating.';return}if(!name){m.textContent='Please add your name.';$('n').focus();return}
 const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Sending…';
 try{await rpc('shop_review_submit',{p_slug:slug,p_name:name,p_rating:rating,p_body:body,p_cake:cake});
  app.innerHTML=`<div class="done"><div class="big">Thank you! 💕</div><p>Your review was sent to ${esc(biz||'your cake artist')}.</p><p style="margin-top:14px"><a class="btn" href="request.html?shop=${encodeURIComponent(slug)}">Order another cake</a></p></div>`}
 catch(err){btn.disabled=false;btn.textContent='Send my review';m.textContent=err.message}});
(async()=>{if(!slug){app.innerHTML='<p>This review link isn’t complete. Please check the link you were sent.</p>';return}
 try{const p=await rpc('shop_reviews_public',{p_slug:slug});if(!p){app.innerHTML='<p>This review link isn’t active.</p>';return}biz=p.business||'';document.title=`Review ${biz} · Dream Cake Builder`;draw()}
 catch{app.innerHTML='<p>We couldn’t load this page. Please check your connection and try again.</p>'}})();
}
</script>
</body>
</html>
